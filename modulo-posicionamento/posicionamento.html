<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}body{font-size:14px}</style>
<title>Posicionamento Imperial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra de contexto em cima; no posicionamento, equipa à esquerda e a grelha à direita, disposta como a folha (Cliente | Balcões | Cozinha). */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#e4e7e1; --ink:#15191c; --ink-2:#4b545a; --line:#d0d5cd;
  --accent:#1f2b37; --accent-ink:#ffffff;
  --prod:#d99a00; --prod-tint:#fbefc9; --prod-ink:#6d4c00;
  --serv:#2a62c4; --serv-tint:#dde7fa; --serv-ink:#163f80;
  --sala:#2d8a4b; --sala-tint:#d9efe0; --sala-ink:#1b5a30;
  --crit:#c4362c; --crit-tint:#fadfdc; --warn:#a86f00; --warn-tint:#f8ecd0; --ok:#2d8a4b; --ok-tint:#d9efe0;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#1a1e21; --surface-2:#242a2e; --ink:#eceeea; --ink-2:#a2aaa6; --line:#323a3f;
  --accent:#e6eaed; --accent-ink:#13181c;
  --prod:#f0b92a; --prod-tint:#3a2f12; --prod-ink:#f6d47a;
  --serv:#6f9df0; --serv-tint:#16253f; --serv-ink:#aac5f7;
  --sala:#5cbf7c; --sala-tint:#14301d; --sala-ink:#9cdcb0;
  --crit:#ee6b60; --crit-tint:#3d1a17; --warn:#e3ad48; --warn-tint:#3a2c10; --ok:#5cbf7c; --ok-tint:#14301d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#1a1e21; --surface-2:#242a2e; --ink:#eceeea; --ink-2:#a2aaa6; --line:#323a3f;
  --accent:#e6eaed; --accent-ink:#13181c;
  --prod:#f0b92a; --prod-tint:#3a2f12; --prod-ink:#f6d47a;
  --serv:#6f9df0; --serv-tint:#16253f; --serv-ink:#aac5f7;
  --sala:#5cbf7c; --sala-tint:#14301d; --sala-ink:#9cdcb0;
  --crit:#ee6b60; --crit-tint:#3d1a17; --warn:#e3ad48; --warn-tint:#3a2c10; --ok:#5cbf7c; --ok-tint:#14301d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{padding-inline:16px;padding-block:14px 48px;max-width:1500px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--serv);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--ink-2);font-weight:600}

/* topo */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:24px}
.brand .eyebrow{font-size:13px}
.nav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--ink-2);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
.field input:disabled,.field select:disabled{background:var(--surface-2)}
.grid-f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.draft{background:var(--warn-tint);color:var(--warn)}
.pill.done{background:var(--ok-tint);color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* início */
.home-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.home-head .today h2{font-size:30px}
.home-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.turno-block{margin-bottom:22px}
.turno-block h3{font-size:19px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pcard{padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard h4{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--surface-2);border-radius:6px;padding:6px 8px}
.stat b{display:block;font-family:var(--f-mono);font-size:17px}
.stat span{font-size:12px;color:var(--ink-2)}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* posicionamento */
.pos-head{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pos-head .title{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.pos-head h2{font-size:28px;line-height:1.05}
.save{font-size:13px;color:var(--ink-2)}
.save.err{color:var(--crit);font-weight:600}
.pos-actions{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;gap:8px;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:10px}
.kpi{padding:10px 12px}
.kpi span{font-size:12.5px;color:var(--ink-2);font-weight:600;display:block}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.kpi small{color:var(--ink-2);font-size:12px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.split i{display:block;height:100%}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:5px}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block}

.avisos{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:var(--r);font-size:14px;border:1px solid transparent}
.aviso.warn{background:var(--warn-tint);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.aviso.ok{background:var(--ok-tint)}
.aviso.crit{background:var(--crit-tint)}
.aviso .tag{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding-top:2px;min-width:64px}
.aviso.warn .tag{color:var(--warn)} .aviso.ok .tag{color:var(--ok)} .aviso.crit .tag{color:var(--crit)}

details.detalhes{margin-bottom:12px}
details.detalhes summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.detalhes summary::-webkit-details-marker{display:none}
details.detalhes summary::before{content:"▸";color:var(--ink-2);transition:transform .15s}
details.detalhes[open] summary::before{transform:rotate(90deg)}
.det-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.vendas{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:start}
.pool{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.pool-head{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.pool-head h3{font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
.pool-list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.pool.drop-hot{outline:2px dashed var(--ink-2);outline-offset:-4px}
.pool-group{font-size:12px;color:var(--ink-2);font-weight:600;padding:6px 4px 2px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-display)}

.card{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:14px;background:var(--surface);display:flex;flex-direction:column;gap:1px;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:pan-y}
.card .n{font-weight:600;display:flex;gap:6px;align-items:center}
.card .h{font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono)}
.card.placed{background:var(--surface-2)}
.card.placed .n{color:var(--ink-2)}
.card.sel,.chip.sel{outline:3px solid var(--serv);outline-offset:1px}
.badge{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--ink-2);font-family:var(--f-display);letter-spacing:.04em}

/* folha de posicionamento (réplica da grelha do Google Sheets) */
.folha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.fh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.fc{padding:8px 12px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:2px}
.fc:first-child{border-left:0}
.fc label,.fo label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.fc input,.fc select,.fo input{border:0;border-bottom:1px solid transparent;background:transparent;padding:3px 0;font-weight:700;font-size:16px;width:100%;min-height:32px;border-radius:0}
.fc input:hover:not(:disabled),.fc select:hover:not(:disabled),.fo input:hover:not(:disabled){border-bottom-color:var(--line)}
.fc input:focus,.fc select:focus,.fo input:focus{border-bottom-color:var(--ink);outline:none}
.fo{padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fo.main{border-bottom:1px solid var(--line);text-align:center;align-items:center;background:var(--surface-2)}
.fo.main input{text-align:center;font-family:var(--f-display);font-size:20px;max-width:720px}
.fo2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.fo2 .fo+.fo{border-left:1px solid var(--line)}
.fo2 input{font-weight:600;font-size:15px}
.board{display:grid;gap:10px;padding:10px;grid-template-columns:minmax(0,1fr) minmax(0,2.35fr) minmax(0,1.5fr);align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone{min-width:0}
.zh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 2px 6px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--ink);margin-bottom:6px}
.zh small{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:0;color:var(--ink-2)}
.zg{display:grid;gap:5px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.cell{border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;position:relative;background:var(--surface);min-width:0;overflow:hidden}
.cell.sp2{grid-column:span 2}
.cell.blank{border:0;background:transparent}
.cell .cl{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.1;padding:4px 6px;min-height:24px;display:flex;align-items:center}
.cell.P .cl{background:var(--prod-tint);color:var(--prod-ink)}
.cell.S .cl{background:var(--serv-tint);color:var(--serv-ink)}
.cell.H .cl{background:var(--sala-tint);color:var(--sala-ink)}
.cell .cv{padding:4px;min-height:38px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cell .free{font-size:13px;color:var(--ink-2);padding-left:4px}
.cell.P.occ{border-color:var(--prod)} .cell.S.occ{border-color:var(--serv)} .cell.H.occ{border-color:var(--sala)}
.cell.off .cv{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.cell.off .cl{text-decoration:line-through;opacity:.7}
.cell.hot{outline:3px solid var(--ink);outline-offset:1px}
.cell .tgl{margin:0 4px 4px;min-height:28px;font-size:12.5px}
.ffoot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;padding:0 10px 12px;border-top:1px solid var(--line);padding-top:10px}
.ftab table{width:100%;border-collapse:collapse;font-size:14px}
.ftab th,.ftab td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.ftab thead th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.ftab tbody th{font-weight:600;white-space:nowrap}
.ftab tfoot th,.ftab tfoot td{font-weight:700;background:var(--surface-2)}
.ftab input{border:0;background:transparent;width:100%;min-height:30px;padding:0;text-align:right}
.ftab td.num{text-align:right}
.fnote{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.seg{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:8px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pq{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);min-height:38px;width:100%}
.card .h.pl{font-family:var(--f-body);color:var(--ink)}
.card.pres{border-left:3px solid var(--ink-2)}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 2px 2px 7px;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:pan-y;min-width:0}
.chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip em{font-style:normal;font-size:11px;color:var(--ink-2);font-weight:600}
.chip .x{border:0;background:transparent;color:var(--ink-2);font-size:17px;line-height:1;width:26px;height:26px;border-radius:5px;flex:none}
.chip .x:hover{background:var(--surface-2);color:var(--crit)}
.extra{display:none;border:1.5px dashed var(--ink-2);border-radius:6px;font-size:12px;text-align:center;padding:4px;color:var(--ink-2)}
body.dragging .extra,body.selecting .extra{display:block}
.extra.hot{background:var(--surface-2);color:var(--ink)}
.toggle-off{position:absolute;inset:auto 6px 6px auto}
.locked .slot,.locked .card,.locked .chip{cursor:default}

.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-60%) rotate(-2deg);opacity:.95}
body.dragging{cursor:grabbing}

.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.selbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:950;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;font-weight:700;color:var(--serv)}

.overlay{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog.wide{width:min(860px,100%)}
.dialog header{padding:16px 18px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dialog header h3{font-size:22px}
.dialog .body{padding:4px 18px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.close{border:0;background:transparent;font-size:22px;color:var(--ink-2);width:36px;height:36px;border-radius:6px}

.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.prow:first-child{border-top:0}
.prow .times{grid-column:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.prow .times input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--surface);min-height:34px;width:100%}
.prow label.nm{font-weight:600;display:flex;gap:6px;align-items:center}
.prow input[type=checkbox]{width:20px;height:20px}
.tl{font-size:11.5px;color:var(--ink-2)}

table.eq{width:100%;border-collapse:collapse}
table.eq th,table.eq td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.eq th{font-size:12.5px;color:var(--ink-2);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .field{min-width:180px}
.chkgrid{display:grid;gap:4px 12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.chkgrid label{display:flex;gap:6px;align-items:center;font-size:14px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px}

.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:6px;border-top:1px solid var(--line);text-align:left}
.ptable th{font-size:12.5px;color:var(--ink-2);border-top:0}
.ptable input,.ptable select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:36px;background:var(--surface);width:100%}

/* guia 25 */
:root{--ta:#0f8b8d;--tb:#7a4fd1;--tc:#4d5f70;--ta-t:#d6eeee;--tb-t:#e9e0f8;--tc-t:#e0e5ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ta:#4fc3c5;--tb:#b394f0;--tc:#9fb0c0;--ta-t:#123436;--tb-t:#2b2044;--tc-t:#252d35}}
:root[data-theme="dark"]{--ta:#4fc3c5;--tb:#b394f0;--tc:#9fb0c0;--ta-t:#123436;--tb-t:#2b2044;--tc-t:#252d35}
.guia{padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:14px}
.g-head{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.g-head h3{font-size:22px}
.g-body{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:stretch}

  }));
  slots.forEach(s=>{s.dup=!!s.val&&names[s.val]>1;});
  const out={slots,train:(train||[]).filter(t=>t.who).length,real:{},guide:{},total:0,free:0,over:0,extra:0,dups:Object.keys(names).filter(k=>names[k]>1)};

  });

}

function fixRP(T,k){let ch=false; Object.keys(T.assign||{}).forEach(key=>{if(/^rp_/.test(key)&&T.assign[key]&&!isRP(T.assign[key])){delete T.assign[key];ch=true;}}); if(ch&&k){S.dirty[k]=1;S.fixed=(S.fixed||0)+1;} return ch;}
function syncFI(T,d,t){ /* formação inicial vinda do plano do Mapa Folgas: quem está em formação, que ação e que posto; o formador escolhe o gerente de turno */
  const W=S.week.sch; if(!W) return false; const di=W.days.indexOf(d); if(di<0) return false; if(T.train.some(e=>e.auto&&!e.who)){T.train=T.train.filter(e=>!(e.auto&&!e.who)); T.fk=null;} const stamp=String(W.ver||W.from); if(T.fk===stamp) return false; T.fk=stamp;
  const av=new Set((availFor(t,d)||[]).map(x=>x.name)), want=[], x=new Set(T.fiX||[]);
  W.staff.forEach(s=>{const dy=s.days[di]; if(dy&&dy.fi&&av.has(s.name)&&FI[dy.fi]&&!x.has(s.name+"|"+dy.fi)) want.push({who:s.name,act:dy.fi});});
  const keep=T.train.filter(e=>!e.auto||want.some(w=>w.who===e.who&&w.act===e.act)); let ch=keep.length!==T.train.length;
  want.forEach(w=>{ if(!keep.some(e=>e.auto&&e.who===w.who&&e.act===w.act)){ keep.push({st:FI[w.act][0],who:w.who,by:"",auto:1,act:w.act}); ch=true; } });
  T.train=keep; return ch;
}
function plan(d,t){const k=planKey(d,t); if(!S.plans[k]){S.plans[k]=fresh(t); applySales(S.plans[k],d,t);} fixRP(S.plans[k],k); if(syncFI(S.plans[k],d,t)){S.dirty[k]=1; scheduleSave();} return S.plans[k];}
const cur=()=>plan(S.date,S.turno);
function applySales(T,d,t){const day=S.week.sal&&S.week.sal[d]; if(!day) return false; TURNOS[t].forEach((h,i)=>{const v=day[hourNum(h)]; if(v!=null) T.rows[i].t=v;}); return true;}
const pkIdx=t=>(S.cfg.pk&&S.cfg.pk[t]!=null)?S.cfg.pk[t]:1;
const pkOf=(T,t)=>{const i=pkIdx(t||S.turno);return {i,v:+T.rows[i].t||0};};
function infoFor(d,t){const T=plan(d,t), pk=pkOf(T,t), b=bandFor(pk.v), N=Math.max(0,Math.min(46,b.n+T.adj));return {T,pk,b,N};}
const info=()=>infoFor(S.date,S.turno);
function analyzeFor(d,t){const {T,N}=infoFor(d,t); return analyze(stationsFor(t),T.assign,T.forced,N,T.train);}

/* ======== persistência (base de dados partilhada) ======== */
let saveTimer=null;
function touch(){ S.dirty[planKey(S.date,S.turno)]=1; scheduleSave(); render(); }
function touchQuiet(){ S.dirty[planKey(S.date,S.turno)]=1; scheduleSave(); }
function scheduleSave(){ S.dbState=S.db?"saving":"local"; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); const e=$("savestate"); if(e) e.innerHTML=saveText(); }
async function flush(){
  const keys=Object.keys(S.dirty); if(!keys.length) return;
  if(!S.db){S.dbState="local";S.dirty={};const e=$("savestate");if(e)e.innerHTML=saveText();return;}
  try{
    for(const k of keys){const [d,t]=k.split("|"); const turno=TK.find(x=>TID[x]===t); const at=Date.now();
      await S.db.collection("gerente_pos_plans").doc(d+"_"+t).set({date:d,turno,json:JSON.stringify(S.plans[k]),at,by:S.uid||""});
      S.meta[k]={at,by:S.uid||""}; delete S.dirty[k];}
    S.dbState="saved"; S.saveAt=Date.now();
  }catch(e){S.dbState="err";}
  const el=$("savestate"); if(el) el.innerHTML=saveText();
}
async function saveShared(id){
  if(!S.db) return;
  try{
    if(id==="week") await S.db.collection("gerente_pos_shared").doc("week").set({json:JSON.stringify({sch:S.week.sch||null,sal:S.week.sal||null,srcS:S.week.srcS||"",srcV:S.week.srcV||""}),at:Date.now()});
    else await S.db.collection("gerente_pos_shared").doc("cfg").set({json:JSON.stringify(S.cfg),at:Date.now()});
  }catch(e){ S.msg={t:"err",m:"Não foi possível guardar na base de dados partilhada."}; }
}
function saveText(){
  if(S.dbState==="err") return `Não foi possível guardar. <button class="btn small" data-act="retry">Tentar outra vez</button>`;
  if(S.dbState==="saving") return "A guardar…";
  if(S.dbState==="local") return "Sem ligação à base de dados: as alterações ficam só neste ecrã.";
  const m=S.meta[planKey(S.date,S.turno)]; const at=(m&&m.at)||S.saveAt; if(!at) return "Guardado automaticamente.";
  const d=new Date(at), who=m&&m.by&&S.names[m.by];
  return `Guardado automaticamente às ${pad(d.getHours())}:${pad(d.getMinutes())}${who?" por "+esc(who):""}`;
}
async function resolveBy(ids){
  const need=ids.filter(i=>i&&S.names[i]===undefined); if(!need.length||!S.user||!S.user.profiles) return;
  try{const ps=await S.user.profiles(need); need.forEach(i=>{S.names[i]=(ps[i]&&ps[i].name)||"";}); render();}catch(e){need.forEach(i=>{S.names[i]="";});}
}
function subscribe(){
  try{
    S.db.collection("gerente_pos_plans").onSnapshot(snap=>{
      const ids=[]; snap.docs.forEach(d=>{const x=d.data(); if(!x||!x.date||!x.turno) return; const k=planKey(x.date,x.turno); if(S.dirty[k]) return;
        try{S.plans[k]=JSON.parse(x.json); S.meta[k]={at:x.at,by:x.by}; if(x.by) ids.push(x.by);}catch(e){}});
      S.dbState=S.dbState==="err"?"err":"saved"; render(); resolveBy([...new Set(ids)]);
    },()=>{S.dbState="err";});
    S.db.collection("gerente_pos_shared").onSnapshot(snap=>{
      snap.docs.forEach(d=>{const x=d.data(); if(!x||!x.json) return; try{const j=JSON.parse(x.json);
        if(d.id==="week"){ if(j.sch){j.sch.staff.forEach(st=>{st.name=canon(st.name); if(!FUNC_MAP.has(norm(st.name))) EXTRA.add(st.name);}); S.week.sch=j.sch; S.week.srcS=j.srcS;} if(j.sal){S.week.sal=j.sal; S.week.srcV=j.srcV;} }
        else if(d.id==="cfg"){ S.cfg=Object.assign({pk:{}},j); S.cfg.pk=Object.assign({Abertura:1,"Transição":1,Fecho:1},j.pk||{}); }
      }catch(e){}});
      render();
    },()=>{});
  }catch(e){S.dbState="err";}
}

/* ======== disponibilidade e distribuição ======== */
function availFor(turno,dateISO){
  const W=S.week.sch; if(!W) return null; const di=W.days.indexOf(dateISO); if(di<0) return null;
  const hrs=TURNOS[turno].map(hourNum), pkh=hrs[pkIdx(turno)], ov=(r,a,b)=>r?Math.max(0,Math.min(r[1],b)-Math.max(r[0],a)):0, out=[];
  W.staff.forEach(st=>{const d=st.days[di]; if(!d||d.k!=="T"||!d.s||d.lv) return; /* azul/laranja = férias, baixa ou licença */
    const pres=h=>Math.max(0,ov(d.s,h*60,h*60+60)-d.br.reduce((a,b)=>a+ov(b,h*60,h*60+60),0));
    if(pres(pkh)<30) return;
    out.push({name:st.name,cov:hrs.filter(h=>pres(h)>=30).length,s0:d.s[0],txt:fm(d.s[0])+"–"+fm(d.s[1])});});
  out.sort((a,b)=>a.s0-b.s0||a.name.localeCompare(b.name,"pt")); return out; /* do mais cedo para o mais tarde */
}
function placedNames(A,T){const n=new Set(); A.slots.forEach(x=>{if(x.val)n.add(x.val);}); T.train.forEach(t=>{if(t.who)n.add(t.who);}); return n;}
function distribute(){
  const T=cur(), st=stationsFor(S.turno), {N}=info(), av=availFor(S.turno,S.date);
  if(!av){S.msg={t:"err",m:"Carrega o horário semanal de uma semana que inclua "+dPT(S.date)+" (separador Ficheiros)."};return render();}
  if(!N){S.msg={t:"err",m:"Sem vendas planeadas para a hora de pico: não há postos no guia."};return render();}
  const trn=new Set(T.train.map(t=>t.who)), pool=av.filter(x=>!trn.has(x.name)).sort((a,b)=>b.cov-a.cov||a.s0-b.s0||a.name.localeCompare(b.name,"pt"));
  const slots=[]; st.forEach(s=>s.slots.forEach((sl,i)=>{if(sl.gp!=null&&sl.gp<=N) slots.push({key:s.id+"_"+i,gp:sl.gp,id:s.id});}));
  slots.sort((a,b)=>a.gp-b.gp);
  const dset=new Set(DELIV.map(norm)), assign={};
  const take=pred=>{const k=pool.findIndex(pred); return k<0?null:pool.splice(k,1)[0];};
  slots.filter(x=>x.id==="rp").forEach(x=>{const p=take(c=>isRP(c.name)); if(p) assign[x.key]=p.name;}); /* só RPs no posto de RP */
  T.train.filter(t=>t.st&&t.who&&t.by).forEach(t=>{const x=slots.find(y=>y.id===t.st&&!assign[y.key]); if(x){const p=take(c=>c.name===t.by&&canTeach(c.name)); if(p) assign[x.key]=p.name;}}); /* quem dá a formação inicial fica no posto */
  slots.filter(x=>(x.id==="delivery"||x.id==="ref38")&&!assign[x.key]).forEach(x=>{const p=take(c=>dset.has(norm(c.name))); if(p) assign[x.key]=p.name;});
  slots.forEach(x=>{if(assign[x.key]||x.id==="rp") return; const p=take(c=>!isRP(c.name)||RP_OK.has(slotZone(x.id))); if(p) assign[x.key]=p.name;}); /* RPs só em Sala, Pagamento e Entrega */
  T.assign=assign; T.forced={};
  const filled=Object.keys(assign).length, empty=slots.length-filled;
  S.msg={t:empty?"err":"good",m:`${filled} de ${slots.length} postos do guia preenchidos com quem trabalha no pico (${S.turno}, ${dPT(S.date)}).`+(empty?` Faltam ${empty} pessoas para completar o guia.`:"")+(pool.length?` ${pool.length} disponíveis ficaram sem posto.`:"")};
  if(slots.some(x=>x.id==="rp"&&!assign[x.key])) S.msg.m+=" O posto de RP ficou livre: não há nenhum RP disponível neste turno.";
  touch();
}

/* ======== PDF ======== */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=()=>rej(new Error("Não foi possível carregar o leitor de PDF."));document.head.appendChild(e);});}
async function rectsOf(pg){
  const O=window.pdfjsLib.OPS, ol=await pg.getOperatorList(), mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
  let ctm=[1,0,0,1,0,0],clip=null,st=[],fill="x",bb=null; const rs=[];
  const tr=b=>{const [x1,x2,y1,y2]=b; const P=[[x1,y1],[x2,y2]].map(([x,y])=>[ctm[0]*x+ctm[2]*y+ctm[4],ctm[1]*x+ctm[3]*y+ctm[5]]); return {x1:Math.min(P[0][0],P[1][0]),x2:Math.max(P[0][0],P[1][0]),y1:Math.min(P[0][1],P[1][1]),y2:Math.max(P[0][1],P[1][1])};};
  const isect=(a,b)=>!a?b:{x1:Math.max(a.x1,b.x1),x2:Math.min(a.x2,b.x2),y1:Math.max(a.y1,b.y1),y2:Math.min(a.y2,b.y2)};
  ol.fnArray.forEach((fn,i)=>{const a=ol.argsArray[i];
    if(fn===O.save) st.push([ctm.slice(),clip]); else if(fn===O.restore){const s=st.pop(); if(s){ctm=s[0];clip=s[1];}} else if(fn===O.transform) ctm=mul(ctm,a);
    else if(fn===O.setFillRGBColor) fill=a.join(",");
    else if(fn===O.setFillGray||fn===O.setFillCMYKColor||fn===O.setFillColorN||fn===O.setFillColorSpace||fn===O.setFillColor) fill="x";
    else if(fn===O.constructPath) bb=a[2];
    else if(fn===O.clip||fn===O.eoClip){ if(bb) clip=isect(clip,tr(bb)); }
    else if((fn===O.fill||fn===O.eoFill||fn===O.fillStroke)&&bb){const r=isect(clip,tr(bb)); if(r.x2>r.x1&&r.y2>r.y1) rs.push({f:fill,...r});}
  });
  return rs;
}
async function pdfPages(file){
  if(!window.pdfjsLib){await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;}
  const d=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, out=[];
  for(let p=1;p<=d.numPages;p++){const pg=await d.getPage(p), tc=await pg.getTextContent(); const arr=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width})); try{arr.rects=await rectsOf(pg);}catch(e){arr.rects=[];} out.push(arr);}
  return out;
}
function setSchedule(sch,src){
  sch.staff.forEach(st=>{st.name=canon(st.name); if(!FUNC_MAP.has(norm(st.name))) EXTRA.add(st.name);});
  S.week.sch=sch; S.week.srcS=src;
}
function setSales(sal,src){S.week.sal=sal; S.week.srcV=src;}
function applyWeekToPlans(){Object.keys(S.plans).forEach(k=>{const [d,t]=k.split("|"); const turno=TK.find(x=>TID[x]===t); if(applySales(S.plans[k],d,turno)) S.dirty[k]=1;}); scheduleSave();}
const XLSXJS="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
async function readXlsx(f){
  if(!window.XLSX) await loadScript(XLSXJS);
  const X=window.XLSX, wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:"array",sheets:["Mapa MT","Planeamento Vendas","Mapa Folgas"],cellFormula:false,cellHTML:false,cellStyles:false,cellNF:false});
  const get=n=>{const ws=wb.Sheets[n]; if(!ws) throw new Error("Não encontrei a folha «"+n+"» neste ficheiro."); const e=X.utils.decode_range(ws["!ref"]).e; return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true,range:{s:{r:0,c:0},e}});};
  return {mapa:get("Mapa MT"),vend:get("Planeamento Vendas"),folgas:wb.Sheets["Mapa Folgas"]?get("Mapa Folgas"):null};
}
async function handleFile(f){
  if(!f) return;
  S.msg={t:"",m:"A ler "+f.name+"…"}; render();
  try{
    if(/\.(xlsm|xlsx|xls)$/i.test(f.name)){
      const x=await readXlsx(f), r=parseXlsxRows(x.mapa,x.vend,x.folgas);
      setSchedule(r.sch,f.name+" · Mapa MT"); setSales(r.sal,f.name+" · Planeamento Vendas"); applyWeekToPlans(); saveShared("week");
      S.msg={t:"good",m:`Ficheiro lido: horário de ${r.sch.staff.length} colaboradores (${dPT(r.sch.days[0])} a ${dPT(r.sch.days[6])}) e vendas por hora de 7 dias${r.nfi?`, mais ${r.nfi} dias de formação inicial`:""}.`};
      render(); return;
    }
    const pages=await pdfPages(f);
    if(pages.some(p=>p.some(i=>/Mapa de Horário/i.test(i.s)))){
      const sch=parseSchedule(pages); setSchedule(sch,f.name); saveShared("week");
      S.msg={t:"good",m:`Horário lido: ${sch.staff.length} colaboradores, de ${dPT(sch.days[0])} a ${dPT(sch.days[6])}.`};
    }else{
      const isT=pages[0].some(i=>/Planifica/i.test(i.s))||pages[0].some(i=>/^Segunda$/i.test(i.s)); const sal=isT?parseSalesT(pages[0],S.week&&S.week.sch&&S.week.sch.from):parseSales(pages[0]); if(!Object.keys(sal).length) throw new Error("Não reconheci este PDF como horário nem como previsão de vendas.");
      setSales(sal,f.name); applyWeekToPlans(); saveShared("week"); const sd=Object.keys(sal), sc=S.week.sch&&S.week.sch.days; const mism=sc&&!sd.some(d=>sc.includes(d));
      S.msg=mism?{t:"err",m:`Vendas lidas para ${dPT(sd[0])} a ${dPT(sd[sd.length-1])}, mas o horário carregado é de ${dPT(sc[0])} a ${dPT(sc[6])}. Carrega também o horário dessa semana (Ficheiros).`}:{t:"good",m:`Vendas lidas para ${sd.length} dias (${dPT(sd[0])} a ${dPT(sd[sd.length-1])}) e aplicadas aos posicionamentos dessa semana.`};
    }
  }catch(e){S.msg={t:"err",m:"Erro ao ler o PDF: "+(e&&e.message||e)};}
  render();
}

function topBar(){
  const v=S.view==="pos"?"inicio":S.view;
  const b=(k,t)=>`<button data-nav="${k}" ${v===k?'aria-current="page"':""}>${t}</button>`;
  return `<div class="top"><div class="brand"><h1>Imperial</h1><span class="eyebrow">Posicionamento</span></div>
   <nav class="nav" aria-label="Secções">${b("inicio","Início")}${b("semana","Semana")}${b("ficheiros","Ficheiros")}${b("equipa","Equipa")}${b("config","Configuração")}</nav></div>`;
}
function fitNames(root){ /* reduz o tamanho da letra até o nome caber inteiro (sem partir palavras) */
  (root||document).querySelectorAll(".cell .chip .cn").forEach(el=>{
    el.style.fontSize=""; let fs=parseFloat(getComputedStyle(el).fontSize)||13.5;
    for(let i=0;i<14&&fs>8.5;i++){
      const lines=Math.round(el.scrollHeight/(fs*1.15));
      if(el.scrollWidth<=el.clientWidth+0.5&&lines<=2) break;
      fs-=0.5; el.style.fontSize=fs+"px";
    }
  });
}
function fitTitles(root){
  (root||document).querySelectorAll(".cell .cl").forEach(el=>{
    el.style.fontSize=""; let fs=parseFloat(getComputedStyle(el).fontSize)||13;
    for(let i=0;i<10&&fs>8.5&&el.scrollWidth>el.clientWidth+0.5;i++){fs-=0.5; el.style.fontSize=fs+"px";}
  });
}
function render(){
  if(S.fixed){S.fixed=0; S.msg={t:"err",m:"Foi retirado do posto de RP quem não tem a função RP (plano guardado antes da regra). Podes usar Sugerir posicionamento para voltar a preencher."}; scheduleSave();}
  if(S.dragging){S.pend=true;return;}
  let h=topBar();
  if(S.view==="inicio") h+=viewInicio(); else if(S.view==="pos") h+=viewPos(); else if(S.view==="semana") h+=viewSemana();
  else if(S.view==="ficheiros") h+=viewFicheiros(); else if(S.view==="equipa") h+=viewEquipa(); else if(S.view==="config") h+=viewConfig();
  const ae=document.activeElement, fid=ae&&ae.id, caret=fid&&ae.selectionStart;
  const sy=window.scrollY; const poolEl=app.querySelector(".pool-list"), ps=poolEl?poolEl.scrollTop:0;
  app.innerHTML=h;
  if(fid){const el=$(fid); if(el){el.focus(); try{if(caret!=null)el.setSelectionRange(caret,caret);}catch(e){}}}
  const p2=app.querySelector(".pool-list"); if(p2) p2.scrollTop=ps;
  document.body.classList.toggle("selecting",!!S.sel);
  renderLayer();
  fitNames(app); fitTitles(app);
}

/* ======== posicionamento ======== */
function viewPos(){

  const rows=nomes.filter(n=>!q||norm(n).includes(q)).map(n=>{const st=byName.get(norm(n)), pp=pessoa(n); const nd=st?st.days.filter(x=>x&&x.k==="T"&&!x.lv).length:null; const d=st&&di>=0?st.days[di]:null;
    const ps=pp?Object.entries(pp.postos).filter(([c,v])=>v[0]>0&&POSTO_NOME[c]).sort((a,b)=>b[1][0]-a[1][0]).map(([c,v])=>`<span class="pc2" title="${esc(POSTO_NOME[c])} · ${v[0]} verificações · última ${v[1].slice(2)}/20${v[1].slice(0,2)}">${c}</span>`).join(""):"";
    return `<tr><td><b>${esc(n)}</b></td><td>${pp?esc(pp.funcao||"Funcionário"):'<span class="muted">sem ligação</span>'}${pp&&pp.treinador?' <span class="rtag">T</span>':""}${pp&&pp.rp?' <span class="rtag rp">RP</span>':""}</td><td>${dset.has(norm(n))?'<span class="pill done">Delivery</span>':""}</td><td><div class="chips">${ps||"–"}</div></td><td class="mono">${nd==null?"–":nd}</td><td class="mono">${d&&d.lv?"Ausente":d&&d.k==="T"&&d.s?fm(d.s[0])+"–"+fm(d.s[1]):esc(d?d.k:"–")}</td></tr>`;}).join("");
  const nT=EQUIPA.filter(x=>x.treinador).length, nR=EQUIPA.filter(x=>x.rp).length;
  const link=sem.length?`<details class="laddet" data-d="alias" ${S.open.alias?"open":""} style="margin-top:12px"><summary>Nomes sem correspondência na plataforma <span class="muted" style="font-weight:500">· ${sem.length}</span></summary><p class="sub2" style="margin-top:8px">Estes nomes (do horário e da lista) não foram encontrados na plataforma. Liga cada um à pessoa certa para a app saber a função e a formação; até lá contam como Funcionário, sem ser treinador nem RP.</p>
    ${sem.map(n=>`<div class="trgrid"><div><b>${esc(n)}</b></div><label class="field"><span class="tl">Pessoa na plataforma</span><select data-alias-for="${esc(n)}">${opts([...(S.cfg.alias&&S.cfg.alias[n]?[S.cfg.alias[n]]:[]),...livres].sort((a,b)=>a.localeCompare(b,"pt")),(S.cfg.alias&&S.cfg.alias[n])||"","Sem ligação")}</select></label></div>`).join("")}</details>`:"";
  return `<div class="home-head"><div class="today"><div class="eyebrow">Equipa</div><h2>Colaboradores</h2></div></div>
   <div class="panel" style="padding:14px;margin-bottom:12px"><p class="sub2" style="margin:0">Dados da Plataforma McD (14/11/2026): <b>${nT} treinadores</b> (só eles dão formação) e <b>${nR} RP</b> (só eles ocupam o posto de RP). Os códigos dos postos são os verificados nas fichas de verificação; passa o rato por cima para ver o posto, o nº de verificações e a última.</p></div>
   <div class="toolbar"><div class="field"><label for="eq">Procurar</label><input id="eq" type="search" value="${esc(S.eq)}" placeholder="Nome"></div></div>
   <div class="panel tablewrap"><table class="eq"><thead><tr><th>Nome</th><th>Função</th><th>Delivery</th><th>Postos verificados</th><th>Dias na semana</th><th>${esc(dShort(S.date))}</th></tr></thead><tbody>${rows}</tbody></table></div>${link}
   <div class="panel" style="padding:14px;margin-top:12px"><div class="eyebrow">Gerentes</div><div class="chips" style="margin-top:6px">${GER.map(g=>{const pp=pessoa(g);return `<span class="pc2">${esc(g)}${pp&&pp.funcao?`<em>${esc(pp.funcao)}</em>`:""}</span>`;}).join("")}</div></div>`;
}

/* ======== configuração ======== */
function viewConfig(){
  return `<div class="home-head"><div class="today"><div class="eyebrow">Configuração</div><h2>Horas de pico</h2></div></div>
   <div class="panel" style="padding:14px"><p class="sub2">A hora de pico de cada turno define o guia: nº de funcionários e quantos postos abrem. Valores atuais: Abertura 13h, Transição 20h, Fecho 00h.</p>
   <div class="grid-f">${TK.map(t=>`<div class="field"><label for="pk_${TID[t]}">${t}</label><select id="pk_${TID[t]}" data-pk="${esc(t)}">${TURNOS[t].map((h,i)=>`<option value="${i}"${i===pkIdx(t)?" selected":""}>${h}</option>`).join("")}</select></div>`).join("")}</div>
   <div style="margin-top:14px"><button class="btn" data-act="guide">Ver Guia Posicionamento</button></div></div>`;
}

/* ======== eventos ======== */
let DRAG=null, EV=null;
const getV=t=>{const T=cur(),k=t[0],v=t.slice(2); return k==="s"?(T.assign[v]||""):(T.train[+v]?T.train[+v].who:"");};
const setV=(t,val)=>{const T=cur(),k=t[0],v=t.slice(2); if(k==="s"){if(val)T.assign[v]=val; else delete T.assign[v];} else if(T.train[+v]) T.train[+v].who=val;};
function removeName(name){const T=cur(); Object.keys(T.assign).forEach(k=>{if(T.assign[k]===name) delete T.assign[k];}); T.train.forEach(t=>{if(t.who===name&&!t.auto)t.who="";});}
function forceOpen(tok){ if(tok[0]!=="s") return; const A=analyzeFor(S.date,S.turno), sl=A.slots.find(x=>x.key===tok.slice(2)); if(sl&&sl.status==="closed") cur().forced[sl.key]=true; }
/* impressão: 1 folha A4 landscape, margens mínimas (4 mm), ficheiro PDF pronto a imprimir */
const CDN_H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", CDN_PDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const loadCdn=src=>new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')) return res(); const e=document.createElement("script"); e.src=src; e.onload=res; e.onerror=()=>rej(new Error("Não foi possível carregar "+src)); document.head.appendChild(e);});
function fiPrint(){ /* formação em lista compacta para a folha impressa (não deixa a coluna da direita mais alta que a folha) */
  const T=cur(), st=stationsFor(S.turno), stl=id=>{const z=st.find(x=>x.id===id);return z?z.l:"–";}, v=x=>esc(x||"–");
  const fi=T.train.filter(t=>t.who||t.st), ct=T.cont.filter(c=>c.who||c.st);
  const li=(a,b,c)=>`<li><b>${v(a)}</b><span>${b}</span><em>Quem dá: <b>${v(c)}</b></em></li>`;
  const d=document.createElement("div"); d.className="panel fprint";
  d.innerHTML=`<h3>Formação inicial</h3>${fi.length?`<ul>${fi.map(t=>li(t.who,esc(t.act?FI[t.act][1]+" · ":"")+(t.st?esc(stl(t.st)):"sem posto no quadro"),t.by)).join("")}</ul>`:`<p>Sem formação inicial neste turno.</p>`}<h3>Formação contínua</h3>${ct.length?`<ul>${ct.map(c=>li(c.who,esc(c.st?stl(c.st):"–"),c.by)).join("")}</ul>`:`<p>Sem formação contínua neste turno.</p>`}`;
  return d;
}
function buildSheet(){ /* folha + guia + formação numa página (usada para imprimir e para o PDF) */
  const wrap=document.createElement("div"); wrap.id="expwrap"; wrap.className="expwrap";
  const f=document.querySelector(".folha").cloneNode(true), side=document.createElement("div"); side.className="expside";
  const g=document.querySelector(".panel.guia");
  if(g){const gc=g.cloneNode(true); gc.querySelectorAll(".laddet,.g-head .btn").forEach(x=>x.remove()); side.appendChild(gc);}
  side.appendChild(fiPrint());
  wrap.append(f,side);
  wrap.querySelectorAll(".x,button").forEach(x=>x.remove());
  wrap.querySelectorAll("select,input").forEach(c=>{const sp=document.createElement("span"); let v=c.tagName==="SELECT"?((c.selectedOptions[0]||{}).textContent||""):c.value; if(!v||/^Escolher|^Definir/.test(v)) v="–"; sp.textContent=v; sp.style.cssText="display:block;font-weight:600;min-height:1.2em"; c.replaceWith(sp);});
  return wrap;
}
async function sheetCanvas(wrap){
  await Promise.all([loadCdn(CDN_H2C),loadCdn(CDN_PDF)]);
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  return window.html2canvas(wrap,{scale:2,backgroundColor:"#ffffff",windowWidth:1700,logging:false,useCORS:true,
    onclone:doc=>{doc.documentElement.setAttribute("data-theme","light"); const w=doc.getElementById("expwrap"); if(w) w.style.opacity="1";}});
}
async function canvasToPdf(cv){
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl) throw new Error("A impressão não está disponível nesta vista.");
  const {jsPDF}=window.jspdf, pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}), M=3, W=297-2*M, H=210-2*M, k=Math.min(W/cv.width,H/cv.height), w=cv.width*k, h=cv.height*k;
  pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",M+(W-w)/2,M+(H-h)/2,w,h,undefined,"FAST");
  const name="Posicionamento_"+S.date+"_"+TID[S.turno]+".pdf";
  await dl.save({filename:name,data:pdf.output("blob")});
  return name;
}
async function exportPdf(){ /* imprime a folha: impressão direta quando o browser deixa; senão gera o PDF A4 horizontal */
  if(S.exporting||!document.querySelector(".folha")) return;
  S.exporting=true; S.msg=null; render();
  const wrap=buildSheet(); document.body.appendChild(wrap); fitNames(wrap); fitTitles(wrap);
  let pr=null;
  try{
    const cv=await sheetCanvas(wrap); wrap.remove();
    pr=document.createElement("div"); pr.id="printimg"; const im=new Image(); im.alt="Posicionamento"; im.src=cv.toDataURL("image/png"); pr.appendChild(im); document.body.appendChild(pr);
    if(im.decode) await im.decode().catch(()=>{});
    let fired=false; const before=()=>{fired=true; document.body.classList.add("printing");};
    const clean=()=>{document.body.classList.remove("printing"); window.removeEventListener("beforeprint",before); window.removeEventListener("afterprint",after); if(pr&&pr.parentNode) pr.remove();};
    const after=()=>{clean(); S.exporting=false; S.msg={t:"good",m:"Impressão enviada (A4 horizontal, 1 folha, margens de 3 mm)."}; render();};
    window.addEventListener("beforeprint",before); window.addEventListener("afterprint",after);
    try{ window.print(); }catch(e){}
    await new Promise(r=>setTimeout(r,700));
    if(fired) return; /* o diálogo abriu: o afterprint termina */
    clean();
    const name=await canvasToPdf(cv);
    S.msg={t:"good",m:"Este ecrã não permite imprimir diretamente, por isso gerei o PDF "+name+" (A4 horizontal, 1 folha, margens de 3 mm). Abre-o e imprime."};
  }catch(e){ if(!(e&&e.code==="declined")) S.msg={t:"err",m:"Não foi possível imprimir: "+((e&&e.message)||"erro")}; }
  if(wrap.parentNode) wrap.remove(); if(pr&&pr.parentNode) pr.remove();
  S.exporting=false; render();
}
function placeBlock(tok,name){ if(!name||tok[0]!=="s") return ""; if(isRP(name)&&!RP_OK.has(slotZone(tok.slice(2).replace(/_\d+$/,"")))) return `${name} é RP: só pode ficar em Sala Clientes, Balcão Pagamento ou Balcão Entrega.`; if(/^rp_/.test(tok.slice(2))&&!isRP(name)) return `${name} não é RP: só quem tem a função RP pode ficar no posto de RP.`; return ""; }
function place(tok){
  const sel=S.sel; if(!sel) return; let bad="";
  if(sel.from){ if(sel.from!==tok){const a=getV(sel.from),b=getV(tok); bad=placeBlock(tok,a)||placeBlock(sel.from,b); if(!bad){forceOpen(tok); setV(tok,a); setV(sel.from,b);} } }
  else{ bad=placeBlock(tok,sel.name); if(!bad){removeName(sel.name); forceOpen(tok); setV(tok,sel.name);} }
  if(bad) S.msg={t:"err",m:bad};
  S.sel=null; touch();
}
function go(view){S.view=view;S.sel=null;window.scrollTo(0,0);render();}
app.addEventListener("click",e=>{
  EV=e; const t=e.target;
  const nav=t.closest("[data-nav]"); if(nav){go(nav.dataset.nav);return;}
  const tn=t.closest("[data-turno]"); if(tn){S.turno=tn.dataset.turno;S.sel=null;render();return;}
  const clr=t.closest("[data-clear]"); if(clr){setV(clr.dataset.clear,""); S.sel=null; touch(); return;}
  const act=t.closest("[data-act]"); if(act){doAct(act.dataset.act,act);return;}
  const pick=t.closest("[data-pick]"); if(pick){const n=pick.dataset.pick; S.sel=(S.sel&&!S.sel.from&&S.sel.name===n)?null:{name:n}; if(S.sel&&window.innerWidth<=820)S.poolOpen=false; render(); return;}
  const slot=t.closest("[data-drop]");
  if(slot){const tok=slot.dataset.drop;
    if(S.sel){place(tok);return;}
    const v=getV(tok); if(v){S.sel={name:v,from:tok};render();return;}
    if(tok[0]==="s"){const A=analyzeFor(S.date,S.turno),sl=A.slots.find(x=>x.key===tok.slice(2)); if(sl&&sl.status==="closed"){cur().forced[sl.key]=true;touch();}}
  }
});
function doAct(a,el){
  const T=cur();
  if(a==="abrir"){S.turno=el.dataset.t;S.view="pos";S.msg=null;window.scrollTo(0,0);render();}
  else if(a==="abrirDia"){S.date=el.dataset.d;S.turno=el.dataset.t;S.view="pos";S.msg=null;window.scrollTo(0,0);render();}
  else if(a==="guide"){S.gm=true;S.gmTab="v";document.body.style.overflow="hidden";render();}
  else if(a==="gClose"){ S.gm=false;document.body.style.overflow="";render();}
  else if(a==="gTab"){S.gmTab=el.dataset.k;render();}
  else if(a==="adj"){T.adj+=+el.dataset.d;touch();}
  else if(a==="dist"){ if(Object.keys(T.assign).length&&!S.armDist){S.armDist=true;setTimeout(()=>{S.armDist=false;render();},4000);render();return;} S.armDist=false; distribute(); }
  else if(a==="clr"){ if(!S.armClr){S.armClr=true;setTimeout(()=>{S.armClr=false;render();},4000);render();return;} S.armClr=false; T.assign={};T.forced={};T.train.forEach(t=>{if(!t.auto)t.who="";});S.msg=null;touch(); }
  else if(a==="cancelSel"){S.sel=null;render();}
  else if(a==="exp"){exportPdf();}
  else if(a==="poolH"){S.poolHide=!S.poolHide;render();}
  else if(a==="poolMode"){S.poolAll=el.dataset.all==="1";render();}
  else if(a==="poolT"){ if(window.innerWidth<=820&&!EV.target.closest("button,input")){S.poolOpen=!S.poolOpen;render();} }
  else if(a==="trAdd"){S.open.form=true;T.train.push({st:"",who:"",by:""});touch();}
  else if(a==="trRm"){const e=T.train[+el.dataset.i]; if(e&&e.auto&&e.who){T.fiX=(T.fiX||[]).concat(e.who+"|"+e.act);} T.train.splice(+el.dataset.i,1);touch();}
  else if(a==="ctAdd"){S.open.form=true;T.cont.push({st:"",who:"",by:""});touch();}
  else if(a==="ctRm"){T.cont.splice(+el.dataset.i,1);touch();}
  else if(a==="retry"){S.dbState="saving";flush();render();}
}
app.addEventListener("change",e=>{
  const t=e.target,d=t.dataset||{}, T=S.view==="pos"?cur():null;
  if(t.id==="dsel"){if(t.value){S.date=t.value;render();}return;}
  if(t.id==="fileS"||t.id==="fileV"){handleFile(t.files[0]);t.value="";return;}
  if(d.pk){S.cfg.pk[d.pk]=+t.value;saveShared("cfg");render();return;}
  if(d.aliasFor!==undefined){S.cfg.alias=S.cfg.alias||{}; if(t.value) S.cfg.alias[d.aliasFor]=t.value; else delete S.cfg.alias[d.aliasFor]; saveShared("cfg");render();return;}
  if(!T) return;
  if(d.f==="gt"||d.f==="gs"){T[d.f]=t.value;touch();}
  else if(d.f==="date"){if(t.value){S.date=t.value;render();}}
  else if(d.f==="turno"){S.turno=t.value;render();}
  else if(d.trSt!==undefined){T.train[+d.trSt].st=t.value;touch();}
  else if(d.trWho!==undefined){T.train[+d.trWho].who=t.value;touch();}
  else if(d.trBy!==undefined){T.train[+d.trBy].by=t.value;touch();}
  else if(d.ctSt!==undefined){T.cont[+d.ctSt].st=t.value;touch();}
  else if(d.ctWho!==undefined){T.cont[+d.ctWho].who=t.value;touch();}
  else if(d.ctBy!==undefined){T.cont[+d.ctBy].by=t.value;touch();}
});
app.addEventListener("input",e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==="pq"){S.q=t.value;render();return;}
  if(t.id==="eq"){S.eq=t.value;render();return;}
  if(S.view!=="pos") return;
  const T=cur();
  if(d.f==="oT"||d.f==="oS"||d.f==="oP"){T[d.f]=t.value;touchQuiet();return;}
  if(d.r!==undefined){T.rows[+d.r][d.k]=t.value===""?0:parseFloat(t.value);touch();}
});
app.addEventListener("toggle",e=>{const d=e.target.dataset&&e.target.dataset.d; if(d) S.open[d]=e.target.open;},true);
layer.addEventListener("click",e=>{
  EV=e; const act=e.target.closest("[data-act]"); if(!act) return;
  if(act.dataset.act==="gClose"&&act.classList.contains("overlay")&&e.target!==act) return;
  doAct(act.dataset.act,act);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.gm){S.gm=false;document.body.style.overflow="";render();} else if(S.sel){S.sel=null;render();}}});

/* arrastar e largar */
document.addEventListener("dragstart",e=>{
  const p=e.target.closest&&e.target.closest("[data-pdrag]"), c=e.target.closest&&e.target.closest("[data-drag]");
  if(p) DRAG={name:p.dataset.pdrag}; else if(c) DRAG={tok:c.dataset.drag}; else return;
  S.dragging=true; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",DRAG.name||getV(DRAG.tok));}catch(_){}
});
document.addEventListener("dragover",e=>{ if(!DRAG) return; const s=e.target.closest&&e.target.closest("[data-drop]"); if(!s) return; e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".dz").forEach(x=>x.classList.remove("dz")); s.classList.add("dz"); });
document.addEventListener("dragend",()=>{DRAG=null;S.dragging=false;document.querySelectorAll(".dz").forEach(x=>x.classList.remove("dz")); if(S.pend){S.pend=false;render();}});
document.addEventListener("drop",e=>{
  if(!DRAG) return; const s=e.target.closest&&e.target.closest("[data-drop]"); if(!s) return; e.preventDefault();
  const d=DRAG; DRAG=null; S.dragging=false; S.pend=false;
  if(d.name) S.sel={name:d.name}; else S.sel={name:getV(d.tok),from:d.tok};
  document.querySelectorAll(".dz").forEach(x=>x.classList.remove("dz"));
  place(s.dataset.drop);
});

/* ======== arranque ======== */
(function(){
  setSchedule(WEEK46.sch,"Semana 46 (horário)"); setSales(WEEK46.sal,"Semana 46 (previsão de vendas)");
  render();
  (async()=>{
    try{ if(window.claude&&window.claude.use){ S.db=await window.claude.use("db"); S.user=await window.claude.use("user"); } }catch(e){}
    if(S.user&&S.user.id){try{S.uid=await S.user.id();}catch(e){}}
    if(S.db){S.dbState="saving";subscribe();setTimeout(()=>{if(S.dbState==="saving"){S.dbState="saved";}render();},1500);}
    render();
  })();
})();

})();
</script>
