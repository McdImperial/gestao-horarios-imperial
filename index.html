<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gestão de Horários — McDonald's Imperial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Aspeto do protótipo aprovado: barra amarela de topo, separadores com sublinhado vermelho, cartões com contorno. */
:root{--red:#da291c;--yel:#ffc72c;--ink:#1f1d1a;--mut:#6a655d;--line:#dedbd3;--bg:#f4f4f1;--card:#fff;--ok:#2e8b57;--warn:#d99a00;--err:#d12f26;--bar:#274b7a;--fh:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:.2px}
header{background:var(--yel);color:var(--ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .m{background:var(--red);color:#fff;font:700 24px/1 var(--fh);width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.brand b{font:700 21px/1 var(--fh);display:block}.brand small{font-size:12px;opacity:.8}
.wkp{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.55);border-radius:10px;padding:4px 6px}
.wkp button{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.wkp select{border:0;background:transparent;font:700 17px var(--fh);color:var(--ink);cursor:pointer;padding:2px 4px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.btn.dark{background:#1f1d1a;color:#fff;border-color:#1f1d1a}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:5}
.tab{padding:12px 14px;border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--mut);font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--red)}
main{padding:18px 16px 60px;max-width:1440px;margin:0 auto}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px;background:#eeece6;border:1px solid var(--line)}
.badge.rascunho{background:#fff3c4;color:#5a4300;border-color:#e6cf7a}.badge.em_validacao{background:#dbe8fb;color:#123b7a;border-color:#a9c4ee}.badge.publicado{background:#d6f0e0;color:#14532d;border-color:#9bd3b1}
.sp{flex:1}
.days{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.day{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;text-align:center;min-width:64px}
.day small{display:block;color:var(--mut)}
.day[aria-selected=true]{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
.day .dot{color:var(--err);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
table.g{border-collapse:separate;border-spacing:0;width:100%}
.g th,.g td{border-bottom:1px solid #efece5;padding:0;vertical-align:middle}
.g thead th{position:sticky;top:0;background:#faf8f3;font-size:11px;color:var(--mut);font-weight:600;z-index:5;height:26px}
.nm{padding:4px 8px;min-width:170px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:#fff;z-index:4}
.dsp{padding:4px 6px;min-width:84px;font-size:12px;color:var(--mut);white-space:nowrap}
.alr{width:34px;text-align:center}
.sym{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;font-weight:700;font-size:13px;cursor:help;color:#fff}
.sym.e{background:var(--err)}.sym.w{background:var(--yel);color:#4a3600}.sym.o{background:#e3f1e4;color:var(--ok)}
.tl{position:relative;height:34px;min-width:960px;background-image:repeating-linear-gradient(90deg,#efece5 0,#efece5 1px,transparent 1px,transparent 40px)}
.tl .h{position:absolute;top:0;bottom:0;border-left:1px solid #d9d4c8}
.bar{position:absolute;top:5px;height:24px;border-radius:5px;background:var(--bar);color:#fff;font-size:11px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.bar.err{background:var(--err);outline:2px solid #ffb3ad}
.bar.warn{background:#c98a00}
.bar .gp{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e5e5e5 3px,#e5e5e5 6px);opacity:.92;border-left:1px solid #0003;border-right:1px solid #0003}
.ed{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 4px 0 0}.ed:hover{color:var(--red)}
.bar{cursor:copy}.bar .gp{cursor:pointer}.bar .gp .rz{width:6px}.bar .gp .rz.r{right:0}
.bar .rz{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .rz.l{left:0}.bar .rz.r{right:0}
.bar .tx{position:relative;z-index:2;pointer-events:none;text-shadow:0 0 3px #0008}
.chip{position:absolute;left:4px;top:5px;height:24px;line-height:24px;padding:0 10px;border-radius:5px;font-weight:600;font-size:12px;background:#eee}
.cov td{font-size:10px;text-align:center;background:#faf8f3;color:var(--mut)}
.covrow{display:flex;min-width:960px}.covrow span{flex:0 0 20px;text-align:center;font-size:10px;padding:3px 0}
.c0{background:#fbe3e1;color:#8a1a12}.c1{background:#fff4cf;color:#6b5100}.c2{background:#e3f3e5;color:#1b5e20}
.muted{color:var(--mut)}
.wk td,.wk th{padding:4px 7px;border-bottom:1px solid #efece5;border-right:1px solid #f1eee7;font-size:12px;white-space:nowrap}
.wk thead th{position:sticky;top:0;background:#faf8f3}
.wk td.nm{border-right:1px solid var(--line)}
.cell{border-radius:4px;padding:2px 5px;display:inline-block;min-width:74px;text-align:center}
.cell.er{outline:2px solid var(--err)}
dialog{border:0;border-radius:12px;padding:0;max-width:520px;width:calc(100% - 24px);box-shadow:0 12px 40px #0004}
dialog::backdrop{background:#0005}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.db{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.db input,.db select{padding:7px;border:1px solid var(--line);border-radius:7px;font-size:14px;color:var(--ink)}
.db .full{grid-column:1/-1}
.msgs{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.msgs div{padding:6px 9px;border-radius:7px;font-size:13px}
.msgs .e{background:#fde7e5;color:#8a1a12}.msgs .w{background:#fff4cf;color:#6b5100}.msgs .i{background:#e8f0fb;color:#1d4b8f}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#tip{position:fixed;z-index:99;background:#1f1d1a;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;max-width:300px;display:none;pointer-events:none;white-space:pre-line}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:9px 16px;border-radius:9px;display:none;z-index:100;max-width:90%}
#toast.bad{background:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px}.kpi small{display:block;color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font:700 34px/1.1 var(--fh)}.kpi span{font-size:13px;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-bottom:14px}
.pad{padding:16px 18px}.pad h2{font-size:22px}.sub{color:var(--mut);font-size:13.5px;margin:2px 0 12px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alist li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.sem{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--warn)}.sem.e{background:var(--err)}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{flex:1;min-width:110px;text-align:center;padding:9px;border-radius:8px;border:1px dashed var(--line);color:var(--mut);font-weight:600}
.steps span.on{border:2px solid var(--ink);background:var(--yel);color:var(--ink)}.steps span.done{border-style:solid;color:var(--ok)}
.chart text{font-family:var(--fh);fill:var(--ink)}.chart .bx{cursor:pointer}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}}
.mf{border-collapse:separate;border-spacing:0;font-size:11px}
.mf th,.mf td{border-right:1px solid #efece5;border-bottom:1px solid #efece5;text-align:center;padding:0;min-width:30px;height:26px}
.mf thead th{position:sticky;top:0;background:#faf8f3;z-index:6;font-weight:600;color:var(--mut)}
.mf thead th b{display:block;font-size:12px;color:var(--ink)}
.mf thead th[data-day]{cursor:pointer}.mf thead th[data-day]:hover{background:#fff3c4}
.mf .nm{position:sticky;left:0;background:#fff;z-index:5;min-width:180px;max-width:180px;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.mf thead .nm{z-index:9;background:#faf8f3}
.mf .yr{min-width:46px;background:#faf8f3;color:var(--mut)}
.mf td.d{cursor:cell;user-select:none;position:relative;font-weight:600;font-size:10.5px}
.mf .we{background:#f5f2ea}.mf thead th.ws{background:#fff3c4}.mf thead th.hoje{box-shadow:inset 0 -3px 0 var(--red)}
.mf td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mf td.tr::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--bar)}
.mf td.cf{outline:2px solid var(--err);outline-offset:-2px}
.mf tfoot td,.mf tfoot th{position:sticky;background:#faf8f3;z-index:6;font-weight:600}
.mf tfoot th.nm{z-index:9;text-align:left}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.pal button{border:2px solid transparent;border-radius:7px;padding:4px 10px;font-weight:700;cursor:pointer;font-size:12.5px}
.pal button[aria-pressed=true]{border-color:var(--ink)}
.mfbox{max-height:calc(100vh - 290px);min-height:320px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:8px 2px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
table.alt tbody.dif>tr:first-child td.nm{background:#fffdf3}
.mtc{text-align:center;line-height:1.25}.mtc.off{color:var(--mut);font-weight:700}.mtc.chg{background:#fff3c4;box-shadow:inset 0 0 0 1px #e6cf7a}
.mtc small{font-size:10px}table.alt tr.rg td{background:#faf8f3;border-bottom:2px solid var(--line)}table.alt tr.rg td.mtc{color:var(--mut);font-size:11px}
.fer{text-align:center;min-width:34px}.fer.ed{cursor:pointer}.fer.ed:hover{background:#fff3c4}.fer.neg{color:var(--err);font-weight:700}
@media print{header,.tabs,.legend,.days,#tip,#toast{display:none!important}body{background:#fff}main{padding:0}.card{border:0;overflow:visible}@page{size:A4 landscape;margin:10mm}.wk td,.wk th{font-size:10px;padding:2px 4px}}
@media(max-width:700px){.dsp{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="m">M</span><div><b>McD Imperial</b><small>Gestão de Horários</small></div></div>
  <div class="wkp"><button id="wprev" title="Semana anterior" aria-label="Semana anterior">‹</button><select id="wsel" aria-label="Semana"></select><button id="wnext" title="Semana seguinte" aria-label="Semana seguinte">›</button></div>
  <span id="wbadge" class="badge"></span>
  <span class="sp"></span>
  <button class="btn" id="bnew">Nova semana</button>
  <button class="btn" id="bcopy">Copiar para a seguinte</button>
  <button class="btn" id="breload" title="Atualizar">↻</button>
  <button class="btn" id="blogout" hidden title="Terminar sessão">Sair</button>
  <button class="btn dark" id="bvalid">Enviar para validação</button>
  <button class="btn pri" id="bpub">Publicar</button>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-t="dash">Dashboard</button>
  <button class="tab" role="tab" data-t="sem">Escala semanal</button>
  <button class="tab" role="tab" data-t="dia">Planeamento diário</button>
  <button class="tab" role="tab" data-t="stf">Staffing</button>
  <button class="tab" role="tab" data-t="func">Funcionários</button>
  <button class="tab" role="tab" data-t="disp">Disponibilidades e ausências</button>
  <button class="tab" role="tab" data-t="mapa">Mapa de folgas</button>
  <button class="tab" role="tab" data-t="alt">Alterações</button>
  <button class="tab" role="tab" data-t="mt">Mapa MT</button>
  <button class="tab" role="tab" data-t="ts">Trabalho suplementar</button>
  <button class="tab" role="tab" data-t="hist">Histórico</button>
  <button class="tab" role="tab" data-t="cfg">Configurações</button>
</div>
<main id="main"><div class="empty">A carregar…</div></main>
<div id="tip"></div><div id="toast"></div>
<dialog id="dlg"></dialog>

<script src="supabase.js"></script>
<script>
(function(){
"use strict";
const URL_='https://tmcigrzsztbsavsiauoy.supabase.co',KEY='sb_publishable_qhsUxvCTk7y7gpsmGwMahg_vovj7x7l';
const sb=supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gh-auth',detectSessionInUrl:false}});
const TZ='Europe/Lisbon',DAYN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],OP=7; // dia operacional começa às 07:00
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={papel:null,semanas:[],sem:null,tab:'dia',dia:0,func:[],tipos:{},disp:{},turnos:[],aus:[],val:[],rules:{pausa_ok:4.5,pausa_max:5,trecho_min:2,dia_max:10}};
const canEdit=()=>['administrador','editor'].includes(S.papel), canPub=()=>S.papel==='administrador';

/* ---------- tempo (Europe/Lisbon) ---------- */
const dtf=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function parts(d){const o={};dtf.formatToParts(d).forEach(p=>o[p.type]=+p.value);return o}
function lisbon(dateStr,h,m){ // data civil + hora local -> Date (UTC correto, DST incluído)
  const [y,mo,d]=dateStr.split('-').map(Number);let g=Date.UTC(y,mo-1,d,h,m);
  for(let i=0;i<2;i++){const p=parts(new Date(g));const asUtc=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute);g+=Date.UTC(y,mo-1,d,h,m)-asUtc}
  return new Date(g)}
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const p2=n=>String(n).padStart(2,'0');
const hhmm=d=>{const p=parts(d);return p2(p.hour)+':'+p2(p.minute)};
const fmtD=s=>{const [y,m,d]=s.split('-');return d+'/'+m};
const fmtH=h=>{const t=Math.round(h*60);return Math.floor(t/60)+'h'+(t%60?p2(t%60):'')};
const fmtHrs=n=>(Math.round(n*100)/100).toString().replace('.',',');
const fmtAv=h=>{const x=((h%24)+24)%24;return p2(Math.floor(x))+':'+p2(Math.round((x%1)*60))+(h>=24?'⁺¹':'')};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',bad?6000:2500)}
function tip(e,txt){const t=$('#tip');if(!txt){t.style.display='none';return}t.textContent=txt;t.style.display='block';const r=t.getBoundingClientRect();t.style.left=Math.min(e.clientX+12,innerWidth-r.width-8)+'px';t.style.top=(e.clientY+14>innerHeight-r.height?e.clientY-r.height-8:e.clientY+14)+'px'}
document.addEventListener('mousemove',e=>{const s=e.target.closest&&e.target.closest('[data-tip]');tip(e,s?s.dataset.tip:null)});
document.addEventListener('scroll',()=>tip(null,null),true);

/* ---------- dados ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return showLogin()}
  $('#blogout').hidden=false;
  const {data:p}=await sb.from('perfis').select('papel,estado').eq('id',session.user.id).maybeSingle();
  if(!p||p.estado!=='ativo'){$('#main').innerHTML='<div class="empty">Sem acesso a este módulo.</div>';return}
  S.papel=p.papel;
  const [f,d,t,r]=await Promise.all([
    sb.from('gh_funcionarios').select('id,mec,nome,funcao,contrato_horas').eq('ativo',true).order('nome'),
    sb.from('gh_disponibilidades').select('funcionario_id,dia_semana,hora_ini,hora_fim').limit(5000),
    sb.from('gh_tipos_ausencia').select('*').order('ordem'),
    sb.from('gh_regras').select('chave,valor,vigor_desde').in('chave',['pausa_ok','pausa_max','trecho_min','dia_max']).order('vigor_desde')]);
  if(f.error){$('#main').innerHTML='<div class="empty">Sem permissão para ler os dados.</div>';return}
  S.func=f.data;S.fmap=Object.fromEntries(f.data.map(x=>[x.id,x]));
  (t.data||[]).forEach(x=>S.tipos[x.codigo]=x);
  (d.data||[]).forEach(x=>{(S.disp[x.funcionario_id]??={})[x.dia_semana]=x});
  (r.data||[]).forEach(x=>S.rules[x.chave]=+x.valor);
  await loadSemanas();
  const hoje=addDays(new Date().toISOString().slice(0,10),0);
  S.sem=S.semanas.find(w=>w.inicio<=hoje&&addDays(w.inicio,6)>=hoje)||S.semanas[S.semanas.length-1]||null;
  if(S.sem&&S.sem.inicio<=hoje&&addDays(S.sem.inicio,6)>=hoje)S.dia=Math.max(0,Math.min(6,Math.round((Date.parse(hoje)-Date.parse(S.sem.inicio))/864e5)));
  await loadSemana();
}
function showLogin(){
  document.querySelectorAll('header,.tabs').forEach(e=>e.style.display='none');
  $('#main').innerHTML=`<form id="lg" style="max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--yel);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px">
  <h1 style="margin:0;font-size:20px">Gestão de <b style="color:var(--red)">Horários</b></h1><div class="muted">McDonald's Imperial · acesso com a tua conta habitual</div>
  <label class="muted" style="font-size:12px">E-mail<input id="lg_e" type="email" autocomplete="username" required style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:3px"></label>
  <label class="muted" style="font-size:12px">Palavra-passe<input id="lg_p" type="password" autocomplete="current-password" required style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:3px"></label>
  <div id="lg_x" style="color:var(--err);font-size:13px;min-height:18px" role="alert"></div><button class="btn pri" style="padding:10px">Entrar</button></form>`;
  $('#lg').onsubmit=async e=>{e.preventDefault();$('#lg_x').textContent='';
    const r=await sb.auth.signInWithPassword({email:$('#lg_e').value.trim(),password:$('#lg_p').value});
    if(r.error){$('#lg_x').textContent='E-mail ou palavra-passe incorretos.';return}
    location.reload()}}
async function loadSemanas(){const {data}=await sb.from('gh_semanas').select('*').order('inicio');S.semanas=data||[];
  $('#wsel').innerHTML=S.semanas.map(w=>`<option value="${w.id}">S${w.semana_iso} · ${fmtD(w.inicio)}–${fmtD(addDays(w.inicio,6))}</option>`).join('')||'<option>Sem semanas</option>'}
async function loadSemana(){
  if(!S.sem){render();return}
  S.sem=S.semanas.find(w=>w.id===S.sem.id)||S.sem;$('#wsel').value=S.sem.id;
  const i=S.sem.inicio,fim=addDays(i,6);
  const [t,a,v]=await Promise.all([
    sb.from('gh_turnos').select('*').eq('semana_id',S.sem.id).order('inicio'),
    sb.from('gh_ausencias').select('funcionario_id,tipo,de,ate').eq('estado','aprovada').lte('de',fim).gte('ate',i),
    sb.rpc('gh_validar_semana',{p_semana:S.sem.id})]);
  S.turnos=t.data||[];S.aus=a.data||[];S.val=v.data||[];render()}

/* ---------- cálculos ---------- */
const diaDe=k=>addDays(S.sem.inicio,k);
const ausDe=(fid,dia)=>S.aus.find(a=>a.funcionario_id===fid&&a.de<=dia&&a.ate>=dia);
function horas(t){const ms=(x,y)=>x&&y?Date.parse(y)-Date.parse(x):0;return (Date.parse(t.fim)-Date.parse(t.inicio)-ms(t.pausa_inicio,t.pausa_fim)-ms(t.pausa2_inicio,t.pausa2_fim))/36e5}
function valDe(fid,dia){return S.val.filter(v=>v.funcionario_id===fid&&v.dia===dia)}
function valSem(fid){return S.val.filter(v=>v.funcionario_id===fid&&!v.dia)}
const worst=l=>l.some(x=>x.nivel==='erro')?'erro':l.length?'aviso':null;

function rFunc(){return `<div class="card"><table class="wk" style="width:100%"><thead><tr><th>Mec.</th><th>Nome</th><th>Função</th><th>Contrato (h/sem)</th></tr></thead><tbody>${S.func.map(f=>`<tr><td>${f.mec}</td><td>${esc(f.nome)}</td><td>${esc(f.funcao||'')}</td><td>${f.contrato_horas}</td></tr>`).join('')}</tbody></table></div>`}

function rSem(){
  const hd=[...Array(7)].map((_,k)=>`<th>${DAYN[k]}<br>${fmtD(diaDe(k))}</th>`).join('');
  const rows=S.func.map(f=>{
    const ts=S.turnos.filter(t=>t.funcionario_id===f.id);let tot=0;
    const cells=[...Array(7)].map((_,k)=>{const d=diaDe(k),t=ts.find(x=>x.dia===d),a=ausDe(f.id,d),vs=valDe(f.id,d),er=vs.some(x=>x.nivel==='erro');
      if(t){tot+=horas(t);const c=t.codigo&&S.tipos[t.codigo];return `<td><span class="cell ${er?'er':''}" style="background:${c&&c.cor||'#e9eef7'};color:${c&&c.cor_texto||'inherit'}" data-tip="${esc(vs.map(v=>v.mensagem).join('\n'))}" data-go="${k}">${hhmm(new Date(t.inicio))}–${hhmm(new Date(t.fim))}${t.codigo?' '+esc(t.codigo):''}</span></td>`}

      return '<td class="muted">—</td>'}).join('');
    if(!ts.length&&!S.aus.some(a=>a.funcionario_id===f.id))return '';
    const sv=valSem(f.id);const over=tot>f.contrato_horas+.01;
    return `<tr><td class="nm">${esc(f.nome)}</td>${cells}<td><b ${over?'style="color:var(--warn)" data-tip="'+esc(sv.map(v=>v.mensagem).join('\n'))+'"':''}>${fmtHrs(tot)}</b> / ${f.contrato_horas}</td></tr>`}).join('');

}

  const foraH=Object.keys(grp).sort((a,b)=>((S.tipos[a]||{}).ordem||99)-((S.tipos[b]||{}).ordem||99)).map(t=>{const c=S.tipos[t]||{};
    return `<div style="display:flex;gap:8px;align-items:flex-start;margin:4px 0"><span class="cell" style="background:${c.cor||'#ead9d6'};color:${c.cor_texto||'inherit'};min-width:52px;flex:none">${esc(t)}</span><span style="font-size:13px"><b>${grp[t].length}</b> · <span class="muted">${esc(c.nome||t)}:</span> ${grp[t].map(id=>S.fmap[id]?esc(S.fmap[id].nome):'').filter(Boolean).sort((a,b)=>a.localeCompare(b)).join(', ')}</span></div>`}).join('');
  const cov=new Array(48).fill(0);
  const rows=list.map(f=>{
    const ts=S.turnos.filter(t=>t.dia===dia&&t.funcionario_id===f.id),a=ausDe(f.id,dia),vs=valDe(f.id,dia),w=worst(vs);
    const dp=S.disp[f.id]&&S.disp[f.id][k];const dtxt=dp?fmtAv(dp.hora_ini)+'–'+fmtAv(dp.hora_fim):'sem disp.';
    let bars='';
    ts.forEach(t=>{
      const s=(Date.parse(t.inicio)-ax0)/36e5*PX,e=(Date.parse(t.fim)-ax0)/36e5*PX,wd=Math.max(e-s,8);
      const pz=[[t.pausa_inicio,t.pausa_fim],[t.pausa2_inicio,t.pausa2_fim]].map((x,ix)=>x[0]?`<span class="gp" data-n="${ix+1}" data-tip="Pausa ${hhmm(new Date(x[0]))}–${hhmm(new Date(x[1]))}${canEdit()?'\nClica para remover · arrasta para mover':''}" style="left:${(Date.parse(x[0])-Date.parse(t.inicio))/36e5*PX}px;width:${(Date.parse(x[1])-Date.parse(x[0]))/36e5*PX}px">${canEdit()?'<i class="rz r"></i>':''}</span>`:'').join('');
      for(let i=0;i<48;i++){const sl=ax0+i*18e5;if(Date.parse(t.inicio)<=sl&&Date.parse(t.fim)>sl){const inP=[[t.pausa_inicio,t.pausa_fim],[t.pausa2_inicio,t.pausa2_fim]].some(x=>x[0]&&Date.parse(x[0])<=sl&&Date.parse(x[1])>sl);if(!inP)cov[i]++}}
      const c=t.codigo&&S.tipos[t.codigo];
      bars+=`<div class="bar ${w==='erro'?'err':w==='aviso'?'warn':''}" data-t="${t.id}" style="left:${s}px;width:${wd}px;${!w&&c?'background:'+c.cor+';color:'+c.cor_texto:''}">${canEdit()?'<i class="rz l"></i><i class="rz r"></i>':''}${pz}<span class="tx">${hhmm(new Date(t.inicio))}–${hhmm(new Date(t.fim))} · ${fmtHrs(horas(t))}h${t.codigo?' · '+esc(t.codigo):''}</span></div>`});
    if(a){const c=S.tipos[a.tipo]||{};bars+=`<span class="chip" style="background:${c.cor||'#eee'};color:${c.cor_texto||'inherit'}" data-tip="${esc(c.nome||a.tipo)}">${esc(a.tipo)}</span>`}
    const sym=w==='erro'?'<span class="sym e" data-tip="'+esc(vs.map(v=>(v.nivel==='erro'?'✕ ':'! ')+v.mensagem).join('\n'))+'">✕</span>':w?'<span class="sym w" data-tip="'+esc(vs.map(v=>'! '+v.mensagem).join('\n'))+'">!</span>':ts.length?'<span class="sym o">✓</span>':'';
    return `<tr data-f="${f.id}"><td class="nm" title="${esc(f.nome)}">${canEdit()&&ts.length?`<button class="ed" data-ed="${ts[0].id}" title="Editar horas">✎</button>`:''}${esc(f.nome)}</td><td class="dsp">${dtxt}</td><td class="alr">${sym}</td><td><div class="tl" data-f="${f.id}">${hours}${bars}</div></td></tr>`}).join('');
  const covr=cov.map((n,i)=>`<span class="${n<(S.rules.cobertura_min||2)?'c0':n<(S.rules.cobertura_min||2)+2?'c1':'c2'}" data-tip="${p2((OP+Math.floor(i/2))%24)}:${i%2?'30':'00'} · ${n} pessoa(s)">${n}</span>`).join('');
  return `<div class="days">${days}</div>
  <div class="legend"><span><i style="background:var(--bar)"></i>Turno</span><span><i style="background:repeating-linear-gradient(45deg,#fff,#fff 3px,#ddd 3px,#ddd 6px)"></i>Pausa (até 2)</span><span><i style="background:var(--err)"></i>Erro</span><span><i style="background:#c98a00"></i>Alerta</span>${canEdit()?'<span>Clica na barra para marcar pausa (até 2) · clica na pausa para a remover · arrasta barra, pontas ou pausa (30 min) · ✎ edita as horas</span>':'<span>Só leitura</span>'}
  <span class="sp"></span><button class="btn" id="bmapa">Mapa de folgas ›</button>${canEdit()?'<button class="btn" id="badd">+ Turno</button>':''}</div>
  <div class="card"><table class="g"><thead><tr><th class="nm">Funcionário</th><th class="dsp">Disponib.</th><th class="alr">⚠</th><th><div class="tl" style="height:22px;background:none">${head}</div></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">Sem turnos neste dia.</td></tr>'}
  <tr class="cov"><td class="nm"><b>Pessoas em loja</b></td><td></td><td></td><td><div class="covrow">${covr}</div></td></tr></tbody></table></div>
  <div class="card" style="padding:10px 14px;margin-top:12px"><b>Fora da escala neste dia</b> <span class="muted" style="font-size:12px">(do mapa de folgas)</span>${foraH||'<div class="muted" style="margin-top:4px">Ninguém com folga, férias ou baixa marcada.</div>'}</div>`;
}

/* ---------- interação do planeamento ---------- */
function bindDia(){
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{S.dia=+b.dataset.d;render()});
  const add=$('#badd');if(add)add.onclick=()=>openEd(null);
  $('#bmapa').onclick=()=>{S.mf=Object.assign(S.mf||{pincel:'OFF',q:''},{mes:diaDe(S.dia).slice(0,7)});S.tab='mapa';render()};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openEd(S.turnos.find(x=>x.id===b.dataset.ed)));
  const AX0=()=>lisbon(diaDe(S.dia),OP,0).getTime(),HALF=18e5,snap=ms=>Math.round(ms/HALF)*HALF;
  document.querySelectorAll('.bar').forEach(el=>{
    const t=S.turnos.find(x=>x.id===el.dataset.t);if(!t)return;
    el.addEventListener('pointerdown',e=>{
      if(!canEdit()||e.button)return;
      const gp=e.target.closest('.gp'),rz=e.target.classList.contains('rz')?(e.target.classList.contains('l')?'l':'r'):null;
      const x0=e.clientX,ini=Date.parse(t.inicio),fim=Date.parse(t.fim);let moved=false,res=null;
      const pz=pausas(t);
      el.setPointerCapture(e.pointerId);
      const mv=ev=>{const d=ev.clientX-x0;if(Math.abs(d)>3)moved=true;if(!moved)return;const dm=Math.round(d/40*2)*HALF,ax=AX0();
        if(gp){const n=+gp.dataset.n-1,p=pz[n];let ps=p[0],pe=p[1];
          if(rz==='r')pe=Math.max(ps+HALF,Math.min(fim,pe+dm));else{const du=pe-ps;ps=Math.max(ini,Math.min(fim-du,ps+dm));pe=ps+du}
          gp.style.left=(ps-ini)/36e5*40+'px';gp.style.width=(pe-ps)/36e5*40+'px';res={n,ps,pe};return}
        let ni=ini+(rz!=='r'?dm:0),nf=fim+(rz!=='l'?dm:0);if(nf-ni<HALF){if(rz==='l')ni=nf-HALF;else nf=ni+HALF}
        el.style.left=(ni-ax)/36e5*40+'px';el.style.width=(nf-ni)/36e5*40+'px';res={ni,nf}};
      const up=async()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);
        if(!moved){ // clique simples
          if(gp){pz.splice(+gp.dataset.n-1,1);return savePausas(t,pz)}
          const box=el.getBoundingClientRect(),at=ini+(e.clientX-box.left)/40*36e5;
          let ps=Math.max(ini,Math.min(snap(at)-0,fim-HALF)),pe=ps+HALF;
          if(pz.length>=2)return toast('Já tem 2 pausas. Clica numa pausa para a remover.',true);
          if(pz.some(p=>ps<p[1]&&pe>p[0])){const p=pz.find(p=>ps<p[1]&&pe>p[0]);ps=ps<p[0]?p[0]-HALF:p[1];pe=ps+HALF}
          if(ps<ini||pe>fim||pz.some(p=>ps<p[1]&&pe>p[0]))return toast('Não há espaço para a pausa aqui.',true);
          pz.push([ps,pe]);return savePausas(t,pz)}
        if(!res)return render();
        if(gp){pz[res.n]=[res.ps,res.pe];return savePausas(t,pz)}
        await saveTurno(t,{inicio:new Date(res.ni),fim:new Date(res.nf)},rz==null)};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
  });
}
const pausas=t=>[[t.pausa_inicio,t.pausa_fim],[t.pausa2_inicio,t.pausa2_fim]].filter(x=>x[0]).map(x=>[Date.parse(x[0]),Date.parse(x[1])]);
async function savePausas(t,pz){
  pz=pz.slice().sort((a,b)=>a[0]-b[0]);const D=x=>x?new Date(x):null;
  return rpcSave({p_turno:t.id,p_func:t.funcionario_id,p_inicio:new Date(t.inicio),p_fim:new Date(t.fim),
    p_pausa_ini:D(pz[0]&&pz[0][0]),p_pausa_fim:D(pz[0]&&pz[0][1]),p_pausa2_ini:D(pz[1]&&pz[1][0]),p_pausa2_fim:D(pz[1]&&pz[1][1]),
    p_modelo:t.modelo,p_versao:t.versao,p_codigo:t.codigo})}

/* ---------- gravar ---------- */
async function saveTurno(t,ch,shift){
  // ch: inicio/fim (Date); mantém as pausas na mesma posição relativa ao início quando se arrasta a barra inteira
  const ini=ch.inicio.getTime(),fim=ch.fim.getTime(),oi=Date.parse(t.inicio),delta=ini-oi;
  const mv=x=>x?new Date(Date.parse(x)+((shift&&fim-ini===Date.parse(t.fim)-oi)?delta:0)):null;
  const clamp=x=>x&&x.getTime()>=ini&&x.getTime()<=fim?x:null;
  const a=clamp(mv(t.pausa_inicio)),b=a?clamp(mv(t.pausa_fim)):null,c=b?clamp(mv(t.pausa2_inicio)):null,d=c?clamp(mv(t.pausa2_fim)):null;
  return rpcSave({p_turno:t.id,p_func:t.funcionario_id,p_inicio:ch.inicio,p_fim:ch.fim,p_pausa_ini:a&&b?a:null,p_pausa_fim:a&&b?b:null,p_pausa2_ini:c&&d?c:null,p_pausa2_fim:c&&d?d:null,p_modelo:t.modelo,p_versao:t.versao,p_codigo:t.codigo})}
async function rpcSave(p,extra){
  const args={p_turno:null,p_semana:S.sem.id,p_pausa_ini:null,p_pausa_fim:null,p_pausa2_ini:null,p_pausa2_fim:null,p_modelo:null,p_versao:null,p_tipo_aviso:null,p_motivo:null,p_codigo:null,...p,...(extra||{})};
  ['p_inicio','p_fim','p_pausa_ini','p_pausa_fim','p_pausa2_ini','p_pausa2_fim'].forEach(k=>{if(args[k] instanceof Date)args[k]=args[k].toISOString()});
  let r=await sb.rpc('gh_guardar_turno',args);
  if(r.error&&S.sem.estado==='publicado'&&!args.p_tipo_aviso){const av=await askAviso();if(!av){await loadSemana();return false}r=await sb.rpc('gh_guardar_turno',{...args,p_tipo_aviso:av.tipo,p_motivo:av.motivo})}
  if(r.error){toast(r.error.message,true);await loadSemana();return false}
  await loadSemana();toast('Guardado');return true}
function askAviso(){return new Promise(res=>{const d=$('#dlg');
  d.innerHTML=`<div class="dh">Semana já publicada</div><div class="db"><div class="msgs"><div class="i">Alterações depois da publicação ficam registadas com o tipo de aviso e o motivo.</div></div>
  <label>Tipo<select id="av_t"><option value="T">T — Temporário</option><option value="D">D — Definitivo</option><option value="T+">T+ — Temporário até…</option></select></label>
  <label class="full">Motivo<input id="av_m" placeholder="Ex.: ajuste por vendas"></label></div>
  <div class="df"><button class="btn" id="av_c">Cancelar</button><button class="btn pri" id="av_o">Confirmar</button></div>`;
  let done=false;const fin=v=>{if(done)return;done=true;d.close();res(v)};
  $('#av_c').onclick=()=>fin(null);d.onclose=()=>fin(null);
  $('#av_o').onclick=()=>{const m=$('#av_m').value.trim();if(!m){$('#av_m').focus();return}fin({tipo:$('#av_t').value,motivo:m})};d.showModal()})}

  <label class="full">Funcionário<select id="e_f" ${t?'disabled':''}>${(t?S.func.filter(f=>f.id===t.funcionario_id):S.func.filter(f=>!used.has(f.id))).map(f=>`<option value="${f.id}">${esc(f.nome)} (${f.contrato_horas}h)</option>`).join('')}</select></label>

  <label>2.ª pausa — fim<input type="time" id="e_p2f" step="900" value="${tm(t&&t.pausa2_fim)}"></label>
  <label class="full">Código (opcional)<select id="e_c"><option value="">— nenhum —</option>${cods.map(c=>`<option value="${c.codigo}" ${t&&t.codigo===c.codigo?'selected':''}>${c.codigo} · ${esc(c.nome)}</option>`).join('')}</select></label>
  <div class="msgs" id="e_m"></div></div>
  <div class="df">${t&&ed?'<button class="btn" id="e_x" style="color:var(--err);margin-right:auto">Remover</button>':''}<button class="btn" id="e_c0">${ed?'Cancelar':'Fechar'}</button>${ed?'<button class="btn pri" id="e_s">Guardar</button>':''}</div>`;
  const q=s=>d.querySelector(s);

/* ---------- Staffing ---------- */
function slots(dia){ // pessoas a trabalhar por meia hora (sem pausas, sem NP)
  const ax=lisbon(dia,OP,0).getTime(),c=new Array(48).fill(0);
  S.turnos.filter(t=>t.dia===dia&&t.codigo!=='NP').forEach(t=>{const ps=pausas(t);
    for(let i=0;i<48;i++){const sl=ax+i*18e5;if(Date.parse(t.inicio)<=sl&&Date.parse(t.fim)>sl&&!ps.some(p=>p[0]<=sl&&p[1]>sl))c[i]++}});return c}
const needFor=(g,v)=>{let n=0;g.forEach(x=>{if(v>=x.de)n=x.n});return n};
const semaforo=d=>d<0?(d<=-3?'#e57373':d===-2?'#ef9a7a':'#f6c28b'):d===0?'#fbe98a':d<=2?'#cfe6c4':d===3?'#8fa7bf':'#6f93c9';
async function rStaff(){
  const i=S.sem.inicio,fim=addDays(i,6);
  const [g,v]=await Promise.all([sb.from('gh_guia_posicionamento').select('vendas_de,pessoas').order('vendas_de'),
    sb.from('gh_vendas_horarias').select('dia,hora,valor').gte('dia',i).lte('dia',fim)]);
  const guia=(g.data||[]).map(x=>({de:+x.vendas_de,n:x.pessoas})),vend={};(v.data||[]).forEach(x=>vend[x.dia+'|'+x.hora]=+x.valor);
  const hh=[...Array(24)].map((_,j)=>`<th>${p2((OP+j)%24)}</th>`).join('');
  let falta=0;
  const rows=[...Array(7)].map((_,k)=>{const dia=diaDe(k),c=slots(dia);
    const cells=[...Array(24)].map((_,j)=>{const h=(OP+j)%24,vv=vend[dia+'|'+h]||0,need=needFor(guia,vv),a=Math.min(c[2*j],c[2*j+1]),d=a-need;
      if(vv&&d<0)falta++;
      return `<td style="text-align:center;background:${vv?semaforo(d):'#f3f1ec'};min-width:38px" data-tip="${DAYN[k]} ${p2(h)}:00\nEm loja (mínimo da hora): ${a}\nNecessárias: ${vv?need:'—'} (vendas ${vv?fmtHrs(vv)+' €':'sem previsão'})">${vv?(d>0?'+'+d:d):''}</td>`}).join('');
    return `<tr><td class="nm"><b>${DAYN[k]}</b> ${fmtD(dia)}</td>${cells}</tr>`}).join('');
  $('#main').innerHTML=`<div class="legend"><span>Diferença entre pessoas em loja e o guia de posicionamento, por hora.</span><span><i style="background:#e57373"></i>falta (−3 ou pior)</span><span><i style="background:#f6c28b"></i>falta</span><span><i style="background:#fbe98a"></i>certo</span><span><i style="background:#cfe6c4"></i>a mais</span><span><i style="background:#6f93c9"></i>muito a mais</span><span class="sp"></span><b>${falta} hora(s) com falta</b></div>
  <div class="card"><table class="wk" style="width:100%"><thead><tr><th>Dia</th>${hh}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="muted" style="font-size:12px">Usa as vendas horárias previstas e o guia de posicionamento do Excel. Horas sem previsão de vendas ficam a cinzento.</p>`}

async function rMapa(){

// Mapa MT (lógica do Excel): 1.º dia livre = DO, seguintes = DC; mais de 2 = TTP; 7 TTP = '-'
function mapaMT(hor){
  const U=hor.map(h=>h==='-'?'DO':h),AC=[];
  for(let i=0;i<7;i++){if(i===0){AC.push(U[0]);continue}
    const anyDO=AC.slice(0,i).some(v=>v==='DO');AC.push(anyDO?(U[i]==='DO'?'DC':U[i]):U[i])}
  const rest=AC.filter(v=>v==='DC'||v==='DO').length;
  let AK=AC.map(v=>rest>2&&(v==='DC'||v==='DO')?'TTP':v);
  if(AK.filter(v=>v==='TTP').length===7)AK=AK.map(()=> '-');
  return AK}
function curRow(fid){ // horário e pausas da semana aberta, no formato do Excel

    if(t){h.push(hs(new Date(t.inicio))+' - '+hs(new Date(t.fim)));hrs+=horas(t);
      const ps=[];[['pausa_inicio','pausa_fim'],['pausa2_inicio','pausa2_fim']].forEach(([a,b])=>{if(t[a]&&t[b])ps.push(hs(new Date(t[a]))+' - '+hs(new Date(t[b])))});
      p.push(ps.length?ps.join('   '):'-')}
    else{const a=ausDe(fid,d),cat=a&&S.tipos[a.tipo]?S.tipos[a.tipo].categoria:null;h.push(a&&cat==='ausencia'?a.tipo:'-');p.push('-')}}
  const mt=mapaMT(h);return {h:mt,p:p.map((x,i)=>isT(mt[i])?x:'-'),hrs}}

  rows.forEach(r=>{const n=Math.max(1,...r.cells.map(c=>String(c==null?'':c).split('\n').length)),h=Math.max(lh,2.5+n*fs*0.38);

  drawAlt()}
function altDiff(fid){const r=S.alt.reg[fid],c=curRow(fid);if(!r)return null;
  return c.h.map((h,i)=>{const rp=isT(r.h[i])?r.p[i]:'-';return h!==r.h[i]||c.p[i]!==rp})}
function drawAlt(){
  const m=$('#main'),ed=canEdit(),lst=mtList(),ws=S.sem.inicio;
  const rows=lst.map(f=>{const c=curRow(f.id),r=S.alt.reg[f.id],df=altDiff(f.id),k=S.alt.cls[f.id],nd=df?df.filter(Boolean).length:0;
    const cell=(h,p,d)=>`<td class="mtc ${isT(h)?'':'off'} ${d?'chg':''}">${cellMT(h,p)}</td>`;
    const regT=r?`<tr class="rg"><td></td><td class="muted" style="font-size:11px">registado</td>${r.h.map((h,i)=>cell(h,isT(h)?r.p[i]:'-',false)).join('')}<td></td><td></td></tr>`:`<tr class="rg"><td></td><td class="muted" style="font-size:11px">registado</td><td colspan="7" class="muted">Sem horário registado${ed?` · <a href="#" data-regis="${f.id}">registar o atual como base</a>`:''}</td><td></td><td></td></tr>`;
    const sel=ed?`<select data-cls="${f.id}"><option value="">—</option>${['T','T+','D'].map(t=>`<option ${k&&k.tipo===t?'selected':''}>${t}</option>`).join('')}</select> ${k&&k.tipo==='T+'?`<input type="date" data-fim="${f.id}" value="${k.fim||''}" min="${addDays(ws,6)}" title="Data até à qual o horário temporário vigora">`:''}`:(k?`<b>${k.tipo}</b>${k.fim?' até '+fmtPT(k.fim):''}`:'');
    return `<tbody class="${nd?'dif':''}"><tr><td>${f.mec}</td><td class="nm"><b>${esc(f.nome)}</b></td>${c.h.map((h,i)=>cell(h,c.p[i],df&&df[i])).join('')}<td>${n1(c.hrs)}</td><td>${sel}${k&&k.aplicada?' <span class="badge publicado">aplicada</span>':''}</td></tr>${regT}</tbody>`}).join('');
  const sem=lst.filter(f=>!S.alt.reg[f.id]).length,porCls=lst.filter(f=>{const d=altDiff(f.id);return d&&d.some(Boolean)&&!S.alt.cls[f.id]}).length;
  const repor=Object.values(S.alt.reg).filter(r=>r.backup&&r.fim&&r.fim<ws&&S.fmap[r.funcionario_id]);
  m.innerHTML=`<div class="legend" style="margin-top:0"><b style="color:var(--ink);font-size:14px">Alterações ao horário registado · Semana ${S.sem.semana_iso}</b><span class="sp"></span>
    ${ed?`<button class="btn" id="baltT" ${porCls?'':'disabled'}>Marcar ${porCls} diferença(s) por classificar como T</button><button class="btn pri" id="baltgen">Verificar e gerar adendas</button>`:''}</div>
    <p class="muted" style="font-size:12px;margin:0 2px 8px"><b>T</b> temporária (só esta semana) · <b>T+</b> temporária até uma data · <b>D</b> definitiva (passa a ser o horário registado). Os dias a amarelo diferem do horário registado.${sem?` ${sem} funcionário(s) sem horário registado.`:''}</p>
    ${repor.length?`<div class="card" style="padding:10px 14px;margin-bottom:10px;border-color:var(--bar)"><b>Horário temporário (T+) terminou:</b> ${repor.map(r=>esc(S.fmap[r.funcionario_id].nome)+' (até '+fmtPT(r.fim)+')').join(', ')} ${ed?`<button class="btn" id="brepor" style="margin-left:8px">Repor horário original</button>`:''}</div>`:''}
    <div id="altchk"></div>
    <div class="card"><table class="wk alt" style="width:100%"><thead><tr><th>Mec.</th><th>Nome</th>${DAYN.map((d,i)=>`<th>${d} ${fmtD(diaDe(i))}</th>`).join('')}<th>Horas</th><th>Aviso</th></tr></thead>${rows||'<tbody><tr><td colspan="11" class="muted">Sem horários nesta semana.</td></tr></tbody>'}</table></div>`;
  if(!ed)return;
  const saveCls=async(fid,tipo,fim)=>{let r;
    if(!tipo)r=await sb.from('gh_alt_semana').delete().eq('semana_id',S.sem.id).eq('funcionario_id',fid);
    else if(tipo==='T+'&&!fim){S.alt.cls[fid]={tipo,fim:null,aplicada:false};return drawAlt()}
    else r=await sb.from('gh_alt_semana').upsert({semana_id:S.sem.id,funcionario_id:fid,tipo,fim:tipo==='T+'?fim:null,aplicada:false},{onConflict:'semana_id,funcionario_id'});
    if(r.error)return toast(r.error.message,true);
    if(!tipo)delete S.alt.cls[fid];else S.alt.cls[fid]={...(S.alt.cls[fid]||{}),tipo,fim:tipo==='T+'?fim:null,aplicada:false};drawAlt()};
  m.querySelectorAll('[data-cls]').forEach(s=>s.onchange=()=>saveCls(s.dataset.cls,s.value,(S.alt.cls[s.dataset.cls]||{}).fim));
  m.querySelectorAll('[data-fim]').forEach(i=>i.onchange=()=>{if(i.value&&i.value<addDays(ws,6))return toast('A data final tem de ser a partir de '+fmtPT(addDays(ws,6))+'.',true);saveCls(i.dataset.fim,'T+',i.value)});
  m.querySelectorAll('[data-regis]').forEach(a=>a.onclick=async e=>{e.preventDefault();const f=S.fmap[a.dataset.regis],c=curRow(f.id);
    const r=await sb.from('gh_horario_registado').upsert({funcionario_id:f.id,h:c.h,p:c.p,horas:f.contrato_horas});if(r.error)return toast(r.error.message,true);toast('Horário base registado');rAlt()});
  $('#baltT').onclick=async()=>{const arr=lst.filter(f=>{const d=altDiff(f.id);return d&&d.some(Boolean)&&!S.alt.cls[f.id]}).map(f=>({semana_id:S.sem.id,funcionario_id:f.id,tipo:'T',fim:null,aplicada:false}));
    const r=await sb.from('gh_alt_semana').upsert(arr,{onConflict:'semana_id,funcionario_id'});if(r.error)return toast(r.error.message,true);toast(arr.length+' marcada(s) como T');rAlt()};
  const br=$('#brepor');if(br)br.onclick=async()=>{for(const r of repor){const b=r.backup;
      const u=await sb.from('gh_horario_registado').update({h:b.h,p:b.p,horas:b.horas,backup:null,fim:null,atualizado_em:new Date().toISOString()}).eq('funcionario_id',r.funcionario_id);if(u.error)return toast(u.error.message,true)}
    toast('Horários originais repostos');rAlt()};
  $('#baltgen').onclick=genAdendas}
async function genAdendas(){
  const box=$('#altchk'),ws=S.sem.inicio,items=[],bloq=[],aviso=[];
  Object.entries(S.alt.cls).forEach(([fid,k])=>{const f=S.fmap[fid];if(!f)return;
    if(k.tipo==='T+'&&!k.fim)bloq.push(f.nome+': T+ sem data final.');
    if(k.tipo==='T+'&&k.fim&&k.fim<addDays(ws,6))bloq.push(f.nome+': data final anterior ao fim da semana.');
    if(!S.alt.reg[fid])bloq.push(f.nome+': sem horário registado para comparar — regista o horário base primeiro.');
    const d=altDiff(fid);if(d&&!d.some(Boolean))aviso.push(f.nome+': classificado mas igual ao horário registado.');
    const r=S.alt.reg[fid],c=curRow(fid);items.push({fid,f:{...f,admissao:S.alt.adm[fid]},tipo:k.tipo,fim:k.fim,cur:c,horas:r?r.horas:f.contrato_horas,reg:r,aplicada:k.aplicada})});
  const errs=S.val.filter(v=>v.nivel==='erro');
  if(errs.length)bloq.push(`Há ${errs.length} erro(s) de validação na semana (ver Planeamento diário) — resolve antes de gerar adendas.`);
  const nd=mtList().filter(f=>{const d=altDiff(f.id);return d&&d.some(Boolean)&&!S.alt.cls[f.id]});
  if(nd.length)aviso.push(`${nd.length} funcionário(s) com diferenças ainda por classificar: ${nd.map(f=>f.nome).join(', ')}.`);
  if(!items.length)bloq.push('Nenhuma alteração classificada (T, T+ ou D).');
  box.innerHTML=`<div class="card" style="padding:10px 14px;margin-bottom:10px;border-color:${bloq.length?'var(--err)':'var(--ok)'}">${bloq.length?'<b style="color:var(--err)">Não é possível gerar:</b><ul>'+bloq.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<b style="color:var(--ok)">Verificação concluída — adendas geradas.</b>'}${aviso.length?'<b>Avisos:</b><ul>'+aviso.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}</div>`;
  if(bloq.length)return;
  try{await adendasPDF(items)}catch(e){return pdfErr(e)}
  for(const it of items){if(it.aplicada||it.tipo==='T')continue;
    const row={funcionario_id:it.fid,h:it.cur.h,p:it.cur.p,horas:it.horas,atualizado_em:new Date().toISOString()};
    if(it.tipo==='D'){row.backup=null;row.fim=null}
    else{row.backup=(it.reg.backup&&it.reg.fim&&it.reg.fim>=ws)?it.reg.backup:{h:it.reg.h,p:it.reg.p,horas:it.reg.horas};row.fim=it.fim}
    const u=await sb.from('gh_horario_registado').upsert(row);if(u.error)return toast('Adenda gerada, mas falhou atualizar o registo: '+u.error.message,true)}
  await sb.from('gh_alt_semana').update({aplicada:true}).eq('semana_id',S.sem.id);
  toast('Adendas geradas e horário registado atualizado');rAlt()}

/* Trabalho suplementar */
const durTxt=t=>{const f=s=>{const [h,m]=s.split(':');return +h*60+ +m};let d=f(t.fim)-f(t.inicio);if(d<0)d+=1440;return Math.floor(d/60)+'H'+p2(d%60)+'M'};
async function rTS(){
  const m=$('#main'),r=await sb.from('gh_trab_suplementar').select('*').eq('semana_id',S.sem.id).order('dia').order('inicio');
  if(r.error){m.innerHTML='<div class="empty">Erro ao carregar: '+esc(r.error.message)+'</div>';return}
  if(S.tab!=='ts')return;
  const L=r.data||[],ed=canEdit();
  const rows=L.map(t=>{const f=S.fmap[t.funcionario_id]||{nome:'—',mec:''};return `<tr><td>${fmtPT(t.dia)}</td><td>${esc(f.nome)} (${f.mec})</td><td>${t.inicio.slice(0,5)}</td><td>${t.fim.slice(0,5)}</td><td>${durTxt(t)}</td><td>${esc(t.motivo||'')}</td>${ed?`<td><button class="btn" data-del="${t.id}">Apagar</button></td>`:''}</tr>`}).join('');
  m.innerHTML=`<div class="legend" style="margin-top:0"><b style="color:var(--ink);font-size:14px">Acréscimo de horas de trabalho · Semana ${S.sem.semana_iso}</b><span class="sp"></span><button class="btn pri" id="btspdf">Descarregar PDF para assinar</button></div>
  ${ed?`<div class="card" style="padding:10px 14px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:end">
    <label class="muted" style="font-size:12px">Dia<br><select id="ts_d" class="btn">${DAYN.map((d,i)=>`<option value="${diaDe(i)}">${d} ${fmtD(diaDe(i))}</option>`).join('')}</select></label>
    <label class="muted" style="font-size:12px">Funcionário<br><select id="ts_f" class="btn" style="max-width:220px">${S.func.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></label>
    <label class="muted" style="font-size:12px">Início<br><input id="ts_i" type="time" class="btn" step="900"></label>
    <label class="muted" style="font-size:12px">Termo<br><input id="ts_e" type="time" class="btn" step="900"></label>
    <label class="muted" style="font-size:12px;flex:1;min-width:200px">Motivo<br><input id="ts_m" class="btn" style="width:100%" placeholder="Motivo para acréscimo de horas"></label>
    <button class="btn dark" id="ts_add">Adicionar</button></div>`:''}
  <div class="card"><table class="wk" style="width:100%"><thead><tr><th>Dia</th><th>Funcionário</th><th>Início</th><th>Termo</th><th>Acréscimo</th><th>Motivo</th>${ed?'<th></th>':''}</tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">Sem acréscimos registados nesta semana.</td></tr>'}</tbody></table></div>`;
  $('#btspdf').onclick=async()=>{try{
    const J=await getPDF(),doc=new J({unit:'mm',format:'a4',orientation:'landscape'});
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('ACRÉSCIMO DE HORAS DE TRABALHO',148.5,14,{align:'center'});
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text(`${EMPRESA.slice(0,28).trim()} · Semana ${S.sem.semana_iso}`,148.5,19,{align:'center'});
    const rr=[{bold:true,cells:['Dia','Funcionário','Início','Termo','Acréscimo','Motivo para acréscimo de horas','Assinatura Funcionário','Assinatura Gerente']}];
    L.forEach(t=>{const f=S.fmap[t.funcionario_id]||{nome:'—',mec:''};rr.push({cells:[fmtPT(t.dia),f.nome+' ('+f.mec+')',t.inicio.slice(0,5),t.fim.slice(0,5),durTxt(t),t.motivo||'','','']})});
    for(let i=L.length;i<12;i++)rr.push({cells:['','','','','','','','']});
    pdfTable(doc,10,24,[22,52,16,16,20,70,40,41],rr,{fs:8,lh:11,pageBreak:200,onBreak:()=>{doc.addPage();return 15}});
    savePDF(doc,`Trabalho suplementar semana ${S.sem.semana_iso}.pdf`)}catch(e){pdfErr(e)}};
  if(!ed)return;
  $('#ts_add').onclick=async()=>{const i=$('#ts_i').value,e=$('#ts_e').value;if(!i||!e)return toast('Indica início e termo.',true);if(i===e)return toast('Início e termo não podem ser iguais.',true);
    const x=await sb.from('gh_trab_suplementar').insert({semana_id:S.sem.id,funcionario_id:$('#ts_f').value,dia:$('#ts_d').value,inicio:i,fim:e,motivo:$('#ts_m').value.trim()||null});
    if(x.error)return toast(x.error.message,true);toast('Acréscimo registado');rTS()};
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const x=await sb.from('gh_trab_suplementar').delete().eq('id',b.dataset.del);if(x.error)return toast(x.error.message,true);rTS()})}

/* ---------- Histórico ---------- */
async function rHist(){
  const r=await sb.from('gh_alteracoes').select('*').eq('semana_id',S.sem.id).order('criado_em',{ascending:false}).limit(300);
  if(r.error)return $('#main').innerHTML='<div class="empty">Sem permissão para ver o histórico.</div>';
  const nm=id=>S.fmap[id]?S.fmap[id].nome:'—',tt=x=>x?hhmm(new Date(x.inicio))+'–'+hhmm(new Date(x.fim)):'(sem turno)';
  const rows=(r.data||[]).map(a=>`<tr><td>${new Date(a.criado_em).toLocaleString('pt-PT',{timeZone:TZ,dateStyle:'short',timeStyle:'short'})}</td><td>${esc(a.criado_por_nome||'')}</td><td>${esc(nm(a.funcionario_id))}</td><td><b>${esc(a.tipo)}</b></td><td>${tt(a.antes)} → ${tt(a.depois)}</td><td>${esc(a.motivo||'')}</td></tr>`).join('');
  $('#main').innerHTML=rows?`<div class="card"><table class="wk" style="width:100%"><thead><tr><th>Quando</th><th>Quem</th><th>Funcionário</th><th>Aviso</th><th>Alteração</th><th>Motivo</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Sem alterações registadas depois da publicação desta semana.</div>'}

/* ---------- exportar ---------- */
function exportCsv(){
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"',L=[];
  L.push(['Mec.','Funcionário',...[...Array(7)].map((_,k)=>DAYN[k]+' '+fmtD(diaDe(k))),'Horas','Contrato'].map(q).join(';'));
  S.func.forEach(f=>{const ts=S.turnos.filter(t=>t.funcionario_id===f.id);if(!ts.length&&!S.aus.some(a=>a.funcionario_id===f.id))return;let tot=0;
    const c=[...Array(7)].map((_,k)=>{const d=diaDe(k),t=ts.find(x=>x.dia===d),a=ausDe(f.id,d);if(t){tot+=horas(t);return hhmm(new Date(t.inicio))+'-'+hhmm(new Date(t.fim))+(t.codigo?' '+t.codigo:'')}return a?a.tipo:''});
    L.push([f.mec,f.nome,...c,String(Math.round(tot*100)/100).replace('.',','),f.contrato_horas].map(q).join(';'))});
  const b=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='Horario_S'+S.sem.semana_iso+'_'+S.sem.inicio+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- cabeçalho ---------- */
$('#wsel').onchange=e=>{S.sem=S.semanas.find(w=>w.id===e.target.value);loadSemana()};
const step=n=>{const i=S.semanas.findIndex(w=>w.id===S.sem?.id)+n;if(S.semanas[i]){S.sem=S.semanas[i];loadSemana()}};
$('#wprev').onclick=()=>step(-1);$('#wnext').onclick=()=>step(1);
$('#blogout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#breload').onclick=async()=>{await loadSemanas();await loadSemana()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
$('#main').addEventListener('click',e=>{const dg=e.target.closest('[data-go]');if(dg&&S.tab==='dash'){S.dia=+dg.dataset.go;S.tab='dia';return render()}if(e.target.id==='bcsv')return exportCsv();if(e.target.id==='bprint')return window.print();const c=e.target.closest('[data-go]');if(c){S.dia=+c.dataset.go;S.tab='dia';render()}});
$('#bnew').onclick=async()=>{const last=S.semanas[S.semanas.length-1];const n=last?addDays(last.inicio,7):new Date().toISOString().slice(0,10);
  const r=await sb.rpc('gh_criar_semana',{p_inicio:n});if(r.error)return toast(r.error.message,true);await loadSemanas();S.sem=S.semanas.find(w=>w.inicio===n);await loadSemana();toast('Semana criada')};
$('#bcopy').onclick=async()=>{const n=addDays(S.sem.inicio,7);if(S.semanas.some(w=>w.inicio===n))return toast('A semana seguinte já existe.',true);
  const r=await sb.rpc('gh_copiar_semana',{p_origem:S.sem.id,p_inicio_destino:n});if(r.error)return toast(r.error.message,true);await loadSemanas();S.sem=S.semanas.find(w=>w.inicio===n);await loadSemana();toast('Semana copiada')};
async function fechar(est){const n=nErros();if(n){toast(`Há ${n} erro(s) por resolver — não é possível ${est==='publicado'?'publicar':'enviar para validação'}.`,true);return}
  const r=await sb.rpc('gh_fechar_semana',{p_semana:S.sem.id,p_estado:est});if(r.error)return toast(r.error.message,true);await loadSemanas();await loadSemana();toast(est==='publicado'?'Semana publicada':'Enviada para validação')}
$('#bvalid').onclick=()=>fechar('em_validacao');$('#bpub').onclick=()=>fechar('publicado');
boot().catch(e=>{$('#main').innerHTML='<div class="empty">Erro ao carregar: '+esc(e.message||e)+'</div>'});
})();
</script>
